<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0"/>

  <title>Book Appointment — Health-Flow</title>

  <link rel="stylesheet" href="shared.css" />

  <script src="https://unpkg.com/@supabase/supabase-js@2.39.0/dist/umd/supabase.js"></script>

  <style>
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(31,29,20,0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(31,29,20,0.035) 1px, transparent 1px);
      background-size: 32px 32px;
      pointer-events: none;
      z-index: 0;
    }

    .page {
      max-width: 1040px;
      margin: 0 auto;
      padding: 36px 20px 72px;
      position: relative;
      z-index: 1;
    }

    /* ── Two-column booking layout ── */
    .booking-layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 24px;
      align-items: start;
    }

    .booking-sidebar {
      position: sticky;
      top: calc(var(--topbar-h) + 20px);
    }

    .clinic-header {
      background: var(--surface);
      border: 1.5px solid var(--border-md);
      border-radius: var(--radius-md);
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: var(--shadow-sm);
    }

    .clinic-header .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 700;
      color: var(--ink-3);
      text-decoration: none;
      margin-bottom: 14px;
      transition: color .15s;
      letter-spacing: 0.02em;
    }

    .clinic-header .back-link:hover {
      color: var(--teal);
    }

    .clinic-name {
      font-family: var(--font-disp);
      font-size: 20px;
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 6px;
      color: var(--ink);
      letter-spacing: -0.01em;
    }

    .clinic-meta {
      font-size: 11px;
      color: var(--ink-3);
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    .hours-panel {
      background: var(--surface);
      border: 1.5px solid var(--border-md);
      border-radius: var(--radius-md);
      padding: 16px;
      box-shadow: var(--shadow-sm);
    }

    .hours-grid {
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .hours-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      padding: 6px 0;
      border-bottom: 1px solid var(--border);
    }

    .hours-row:last-child {
      border-bottom: none;
    }

    .hours-day {
      color: var(--ink-3);
      font-weight: 500;
    }

    .hours-time {
      color: var(--ink);
      font-weight: 600;
    }

    .hours-closed {
      color: var(--rust);
      font-weight: 600;
    }

    .hours-loading {
      font-size: 12px;
      color: var(--ink-3);
      text-align: center;
      padding: 8px 0;
      font-style: italic;
    }

    .booking-card {
      background: var(--surface);
      border: 1.5px solid var(--border-md);
      border-radius: var(--radius-md);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }

    .booking-steps {
      display: flex;
      border-bottom: 1px solid var(--border);
      background: var(--surface2);
    }

    .step-tab {
      flex: 1;
      padding: 13px;
      text-align: center;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-3);
      border-bottom: 2.5px solid transparent;
      transition: color .2s, border-color .2s;
    }

    .step-tab.active {
      color: var(--teal);
      border-bottom-color: var(--teal);
    }

    .step-tab.done {
      color: var(--teal);
      opacity: 0.6;
    }

    .booking-body {
      padding: 22px;
    }

    .date-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      margin-bottom: 4px;
    }

    .day-header {
      text-align: center;
      font-size: 9px;
      color: var(--ink-3);
      padding: 4px 0;
      letter-spacing: 0.06em;
      font-weight: 700;
      text-transform: uppercase;
    }

    .date-btn {
      aspect-ratio: 1;
      border: 1.5px solid var(--border-md);
      background: var(--surface2);
      border-radius: var(--radius-sm);
      color: var(--ink);
      font-family: var(--font-mono);
      font-size: 11px;
      cursor: pointer;
      transition: background .15s, border-color .15s, color .15s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .date-btn:hover:not(:disabled) {
      border-color: var(--teal);
      color: var(--teal);
    }

    .date-btn.selected {
      background: var(--teal);
      color: #fff;
      border-color: var(--teal);
      font-weight: 700;
    }

    .date-btn:disabled {
      opacity: 0.2;
      cursor: not-allowed;
    }

    .date-btn.closed {
      opacity: 0.18;
      cursor: not-allowed;
    }

    .date-btn.today {
      border-color: var(--cerulean);
      color: var(--cerulean);
    }

    .date-btn.today.selected {
      background: var(--teal);
      color: #fff;
      border-color: var(--teal);
    }

    .cal-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .cal-nav-btn {
      background: var(--surface2);
      border: 1.5px solid var(--border-md);
      border-radius: var(--radius-sm);
      color: var(--ink-3);
      font-family: var(--font-mono);
      font-size: 14px;
      padding: 5px 12px;
      cursor: pointer;
      transition: color .15s, border-color .15s;
    }

    .cal-nav-btn:hover {
      color: var(--ink);
      border-color: var(--ink-3);
    }

    .cal-month-label {
      font-family: var(--font-disp);
      font-size: 15px;
      font-weight: 700;
      color: var(--ink);
    }

    .slots-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 8px;
    }

    .slot-btn {
      padding: 11px 4px;
      border: 1.5px solid var(--border-md);
      background: var(--surface2);
      border-radius: var(--radius-sm);
      color: var(--ink);
      font-family: var(--font-mono);
      font-size: 11px;
      cursor: pointer;
      text-align: center;
      transition: background .15s, border-color .15s, color .15s;
    }

    .slot-btn:hover {
      border-color: var(--teal);
      color: var(--teal);
    }

    .slot-btn.selected {
      background: var(--teal);
      color: #fff;
      border-color: var(--teal);
      font-weight: 700;
    }

    .slots-closed {
      text-align: center;
      padding: 28px;
      color: var(--ink-3);
      font-size: 13px;
      font-style: italic;
    }

    .slots-loading {
      text-align: center;
      padding: 24px;
      color: var(--ink-3);
      font-size: 12px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.09em;
      color: var(--ink-3);
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .form-input {
      width: 100%;
      background: var(--surface2);
      border: 1.5px solid var(--border-md);
      border-radius: var(--radius-sm);
      color: var(--ink);
      font-family: var(--font-body);
      font-size: 13px;
      font-weight: 500;
      padding: 10px 12px;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }

    .form-input:focus {
      border-color: var(--teal);
      box-shadow: 0 0 0 3px rgba(0,137,123,0.1);
    }

    .form-input::placeholder {
      color: var(--ink-4);
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .summary-box {
      background: var(--surface2);
      border: 1.5px solid var(--border-md);
      border-radius: var(--radius-sm);
      padding: 16px 18px;
      margin-bottom: 20px;
      font-size: 13px;
    }

    .summary-box .summary-title {
      font-family: var(--font-disp);
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 12px;
      color: var(--ink);
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      padding: 5px 0;
      border-bottom: 1px solid var(--border);
      font-size: 12px;
    }

    .summary-row:last-child {
      border-bottom: none;
    }

    .summary-key {
      color: var(--ink-3);
      font-weight: 500;
    }

    .summary-val {
      color: var(--ink);
      font-weight: 600;
    }

    .step-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid var(--border);
    }

    .btn-back {
      background: var(--surface2);
      border: 1.5px solid var(--border-md);
      border-radius: var(--radius-sm);
      color: var(--ink-3);
      font-family: var(--font-body);
      font-size: 12px;
      font-weight: 700;
      padding: 10px 18px;
      cursor: pointer;
      transition: color .15s, border-color .15s;
    }

    .btn-back:hover {
      color: var(--ink);
      border-color: var(--ink-3);
    }

    .btn-next {
      background: var(--obsidian);
      border: none;
      border-radius: var(--radius-sm);
      color: #F7F4EE;
      font-family: var(--font-body);
      font-size: 12px;
      font-weight: 700;
      padding: 10px 22px;
      cursor: pointer;
      transition: opacity .15s;
      box-shadow: 0 2px 6px rgba(31,29,20,0.25);
    }

    .btn-next:hover:not(:disabled) {
      opacity: 0.85;
    }

    .btn-next:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .btn-next.danger {
      background: var(--rust);
    }

    .confirmation {
      text-align: center;
      padding: 36px 22px;
    }

    .confirm-icon {
      font-size: 52px;
      margin-bottom: 18px;
    }

    .confirm-title {
      font-family: var(--font-disp);
      font-size: 22px;
      font-weight: 700;
      color: var(--teal);
      margin-bottom: 8px;
    }

    .confirm-sub {
      font-size: 13px;
      color: var(--ink-3);
      margin-bottom: 24px;
      line-height: 1.6;
    }

    .confirm-ref {
      font-size: 12px;
      background: var(--surface2);
      border: 1.5px solid var(--border-md);
      border-radius: var(--radius-sm);
      padding: 9px 18px;
      display: inline-block; 
      margin-bottom: 24px;
      letter-spacing: 0.06em;
      font-family: var(--font-mono);
    }

    .confirm-ref span {
      color: var(--teal);
    }

    .error-state {
      text-align: center;
      padding: 72px 20px;
    }

    .error-state h2 {
      font-family: var(--font-disp);
      font-size: 20px;
      margin-bottom: 8px;
      color: var(--ink);
    }

    .error-state p {
      font-size: 13px;
      color: var(--ink-3);
    }

    @media (max-width: 780px) {
      .booking-layout {
        grid-template-columns: 1fr;
      }

      .booking-sidebar {
        position: static;
      }
    }

    @media (max-width: 500px) {
      .slots-grid {
        grid-template-columns: repeat(3, 1fr);
      }

      .form-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <header class="topbar">

    <h1 class="brand">

      <span class="brand-icon">✚</span>

      <strong class="brand-name">
        Health-Flow
      </strong>

    </h1>

    <nav aria-label="Back navigation">

      <a href="dashboard.html"
         class="btn btn-outline">
        ← Dashboard
      </a>

    </nav>

  </header>

  <main class="page" id="app">

    <section style="text-align:center;
                    padding:80px 20px;
                    color:var(--ink-3);
                    font-size:13px;
                    font-style:italic;">

      <p>
        Loading facility…
      </p>

    </section>

  </main>

  <script type="module" src="../backend/booking.js?v=3"></script>

</body>
</html>
