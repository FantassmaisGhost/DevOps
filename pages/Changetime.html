<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Operating Hours | Health-Flow</title>

  <link rel="stylesheet" href="shared.css" />

  <style>
    .hours-table {
      background: var(--surface);
      border: 1.5px solid var(--border-md);
      border-radius: var(--radius-md);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }

    .hours-table table {
      width: 100%;
      border-collapse: collapse;
    }

    .hours-table th {
      background: var(--obsidian);
      padding: 12px 18px;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(247,244,238,0.55);
      text-align: left;
      border-bottom: 1.5px solid rgba(247,244,238,0.08);
    }

    .hours-table td {
      padding: 12px 18px;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
      vertical-align: middle;
    }

    .hours-table tr:last-child td {
      border-bottom: none;
    }

    .hours-table tr:hover td {
      background: var(--surface2);
    }

    .day-label {
      font-weight: 700;
      color: var(--ink);
      font-family: var(--font-body);
    }

    input[type="time"] {
      background: var(--surface2);
      border: 1.5px solid var(--border-md);
      border-radius: var(--radius-sm);
      color: var(--ink);
      font-family: var(--font-mono);
      font-size: 12px;
      padding: 7px 10px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
      color-scheme: light;
    }

    input[type="time"]:focus {
      border-color: var(--teal);
      box-shadow: 0 0 0 3px rgba(0,137,123,0.12);
    }

    input[type="checkbox"] {
      width: 17px;
      height: 17px;
      accent-color: var(--teal);
      cursor: pointer;
    }

    .form-actions {
      display: flex;
      justify-content: flex-end;
      padding: 14px 18px;
      border-top: 1px solid var(--border);
      background: var(--surface2);
    }

    .page-intro {
      font-size: 12px;
      color: var(--ink-3);
      margin-bottom: 24px;
      line-height: 1.6;
    }
  </style>
</head>

<body>

  <header class="topbar">

    <section class="brand">

      <figure class="brand-icon" aria-hidden="true">
        ✚
      </figure>

      <strong class="brand-name">
        Health-Flow
      </strong>

    </section>

    <nav class="topbar-right">

      <p class="role-badge badge-admin">
        Admin
      </p>

      <a href="admin-dashboard.html" class="btn btn-outline">
        ← Admin Dashboard
      </a>

    </nav>

  </header>

  <main class="page">

    <header>

      <h1 class="section-label" style="margin-bottom:6px;">
        Operating Hours Management
      </h1>

      <p class="page-intro">
        Edit clinic opening and closing times for each day of the week.
      </p>

    </header>

    <form id="hoursForm">

      <section class="hours-table">

        <table>

          <thead>
            <tr>
              <th>Day</th>
              <th>Open Time</th>
              <th>Close Time</th>
              <th>Open?</th>
            </tr>
          </thead>

          <tbody>

            <tr>
              <th scope="row" class="day-label">Monday</th>
              <td>
                <input
                  type="time"
                  data-day="Monday"
                  data-field="opentime"
                  value="08:00"
                />
              </td>
              <td>
                <input
                  type="time"
                  data-day="Monday"
                  data-field="closingtime"
                  value="17:00"
                />
              </td>
              <td>
                <input
                  type="checkbox"
                  data-day="Monday"
                  data-field="isopen"
                  checked
                />
              </td>
            </tr>

            <tr>
              <th scope="row" class="day-label">Tuesday</th>
              <td>
                <input
                  type="time"
                  data-day="Tuesday"
                  data-field="opentime"
                  value="08:00"
                />
              </td>
              <td>
                <input
                  type="time"
                  data-day="Tuesday"
                  data-field="closingtime"
                  value="17:00"
                />
              </td>
              <td>
                <input
                  type="checkbox"
                  data-day="Tuesday"
                  data-field="isopen"
                  checked
                />
              </td>
            </tr>

            <tr>
              <th scope="row" class="day-label">Wednesday</th>
              <td>
                <input
                  type="time"
                  data-day="Wednesday"
                  data-field="opentime"
                  value="08:00"
                />
              </td>
              <td>
                <input
                  type="time"
                  data-day="Wednesday"
                  data-field="closingtime"
                  value="17:00"
                />
              </td>
              <td>
                <input
                  type="checkbox"
                  data-day="Wednesday"
                  data-field="isopen"
                  checked
                />
              </td>
            </tr>

            <tr>
              <th scope="row" class="day-label">Thursday</th>
              <td>
                <input
                  type="time"
                  data-day="Thursday"
                  data-field="opentime"
                  value="08:00"
                />
              </td>
              <td>
                <input
                  type="time"
                  data-day="Thursday"
                  data-field="closingtime"
                  value="17:00"
                />
              </td>
              <td>
                <input
                  type="checkbox"
                  data-day="Thursday"
                  data-field="isopen"
                  checked
                />
              </td>
            </tr>

            <tr>
              <th scope="row" class="day-label">Friday</th>
              <td>
                <input
                  type="time"
                  data-day="Friday"
                  data-field="opentime"
                  value="08:00"
                />
              </td>
              <td>
                <input
                  type="time"
                  data-day="Friday"
                  data-field="closingtime"
                  value="15:00"
                />
              </td>
              <td>
                <input
                  type="checkbox"
                  data-day="Friday"
                  data-field="isopen"
                  checked
                />
              </td>
            </tr>

            <tr>
              <th scope="row" class="day-label">Saturday</th>
              <td>
                <input
                  type="time"
                  data-day="Saturday"
                  data-field="opentime"
                  value="09:00"
                />
              </td>
              <td>
                <input
                  type="time"
                  data-day="Saturday"
                  data-field="closingtime"
                  value="13:00"
                />
              </td>
              <td>
                <input
                  type="checkbox"
                  data-day="Saturday"
                  data-field="isopen"
                  checked
                />
              </td>
            </tr>

            <tr>
              <th scope="row" class="day-label">Sunday</th>
              <td>
                <input
                  type="time"
                  data-day="Sunday"
                  data-field="opentime"
                  value=""
                />
              </td>
              <td>
                <input
                  type="time"
                  data-day="Sunday"
                  data-field="closingtime"
                  value=""
                />
              </td>
              <td>
                <input
                  type="checkbox"
                  data-day="Sunday"
                  data-field="isopen"
                />
              </td>
            </tr>

          </tbody>

        </table>

        <footer class="form-actions">

          <button
            type="submit"
            class="btn btn-primary"
            id="saveBtn"
          >
            Save Changes
          </button>

        </footer>

      </section>

    </form>

  </main>

  <script type="module" src="../backend/tableAdmin.js"></script>

</body>
</html>
