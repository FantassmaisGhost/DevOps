<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clinic Directory | Health-Flow</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="clinic_app.css">
<style>
/* ── Health-Flow topbar ── */
.hf-topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 58px;
  padding: 0 22px;
  background: #18160F;
  position: sticky;
  top: 0;
  z-index: 300;
  gap: 16px;
  font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
  box-sizing: border-box;
}
.hf-topbar::after {
  content: '';
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(247,244,238,0.02) 1px, transparent 1px),
    linear-gradient(90deg, rgba(247,244,238,0.02) 1px, transparent 1px);
  background-size: 24px 24px;
  pointer-events: none;
}
.hf-brand {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
  text-decoration: none;
  position: relative;
  z-index: 1;
}
.hf-brand-icon {
  width: 30px; height: 30px;
  background: #00897B;
  border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; color: #fff;
  box-shadow: 0 2px 8px rgba(0,137,123,0.4);
  flex-shrink: 0;
  font-style: normal;
}
.hf-brand-name {
  font-family: 'Playfair Display', Georgia, serif;
  font-size: 17px;
  font-weight: 700;
  color: #F7F4EE;
  letter-spacing: -0.01em;
  font-style: normal;
}
.hf-tabs {
  display: flex;
  align-items: center;
  gap: 3px;
  flex: 1;
  justify-content: center;
  position: relative;
  z-index: 1;
}
.hf-tab-btn {
  height: 34px;
  padding: 0 16px;
  background: transparent;
  border: 1.5px solid transparent;
  border-radius: 6px;
  color: rgba(247,244,238,0.45);
  font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.15s;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  letter-spacing: 0.01em;
  white-space: nowrap;
}
.hf-tab-btn:hover {
  color: rgba(247,244,238,0.8);
  background: rgba(247,244,238,0.07);
}
.hf-tab-btn.active {
  background: rgba(0,137,123,0.18);
  border-color: rgba(0,137,123,0.3);
  color: #5ccec5;
}
.hf-topbar-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
  position: relative;
  z-index: 1;
}
.hf-user-email {
  font-size: 11px;
  color: rgba(247,244,238,0.4);
  max-width: 180px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-weight: normal;
}
.hf-role-badge {
  font-family: 'Fira Code', 'Courier New', monospace;
  font-size: 9px;
  font-weight: 500;
  letter-spacing: 0.1em;
  padding: 3px 9px;
  border-radius: 3px;
  text-transform: uppercase;
  background: rgba(27,79,138,0.15);
  color: #3b72b8;
  border: 1px solid rgba(27,79,138,0.25);
}
.hf-logout-btn {
  font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
  font-size: 12px;
  font-weight: 700;
  padding: 7px 14px;
  border-radius: 7px;
  border: 1.5px solid rgba(247,244,238,0.12);
  cursor: pointer;
  background: rgba(247,244,238,0.07);
  color: rgba(247,244,238,0.45);
  transition: all 0.13s ease;
  white-space: nowrap;
  letter-spacing: 0.01em;
}
.hf-logout-btn:hover {
  color: #B94A1E;
  border-color: rgba(185,74,30,0.4);
  background: rgba(185,74,30,0.1);
}
.hf-dash-btn {
  font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
  font-size: 12px;
  font-weight: 700;
  padding: 7px 14px;
  border-radius: 7px;
  border: 1.5px solid rgba(247,244,238,0.18);
  cursor: pointer;
  background: transparent;
  color: rgba(247,244,238,0.55);
  transition: all 0.13s ease;
  white-space: nowrap;
  letter-spacing: 0.01em;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.hf-dash-btn:hover {
  color: #F7F4EE;
  border-color: rgba(247,244,238,0.4);
}
</style>
</head>

<body>

<header class="hf-topbar">
  <strong class="hf-brand">
    <em class="hf-brand-icon">✚</em>
    <b class="hf-brand-name">Health-Flow</b>
  </strong>
  <nav class="hf-tabs" aria-label="App sections">
    <button class="hf-tab-btn active" id="clinicsBtn">🏥 Find Clinics</button>
    <button class="hf-tab-btn" id="bookingsBtn">📅 My Bookings</button>
  </nav>
  <nav class="hf-topbar-right" aria-label="User controls">
    <small class="hf-user-email" id="userEmail">Loading…</small>
    <b class="hf-role-badge" id="roleBadge">Patient</b>
    <button class="hf-logout-btn" id="logoutBtn">Sign out</button>
  </nav>
</header>

<main class="main">

  <section id="content">

    <article class="loading-wrap">

      <figure class="spinner"></figure>

      <p class="loading-label">
        Loading clinics…
      </p>

    </article>

  </section>

</main>

<aside class="modal-backdrop"
       id="reviewModal"
       aria-hidden="true">

  <section class="modal-panel">

    <header class="modal-top-bar"></header>

    <section class="modal-body">

      <button class="modal-close-btn"
              id="closeModalBtn"
              aria-label="Close review modal">
        ✕
      </button>

      <h2 class="modal-heading">
        Submit a Review
      </h2>

      <p class="modal-sub"
         id="reviewClinicName">
      </p>

      <section class="star-group"
               id="starContainer"
               aria-label="Review rating">

        <button class="star"
                data-rating="1"
                type="button">
          ★
        </button>

        <button class="star"
                data-rating="2"
                type="button">
          ★
        </button>

        <button class="star"
                data-rating="3"
                type="button">
          ★
        </button>

        <button class="star"
                data-rating="4"
                type="button">
          ★
        </button>

        <button class="star"
                data-rating="5"
                type="button">
          ★
        </button>

      </section>

      <textarea class="modal-textarea"
                id="reviewComment"
                rows="4"
                placeholder="Describe your experience at this facility…">
      </textarea>

      <button class="modal-submit"
              id="submitReviewBtn">
        Submit Review
      </button>

    </section>

  </section>

</aside>

<script src="../backend/clinic_app.js"></script>
<script>
(function() {
  sb.auth.getSession().then(({ data: { session } }) => {
    if (!session) return;
    document.getElementById('userEmail').textContent = session.user.email;
    const role = localStorage.getItem('userRole') || 'patient';
    const labels = { patient: 'Patient', admin: 'Admin', staff: 'Staff', receptionist: 'Receptionist' };
    const badgeEl = document.getElementById('roleBadge');
    if (badgeEl) badgeEl.textContent = labels[role] || role;
  });
  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await sb.auth.signOut();
    localStorage.removeItem('userRole');
    window.location.href = 'index.html';
  });
})();
</script>
<script type="module" src="../backend/nav.js"></script>

</body>
</html>
