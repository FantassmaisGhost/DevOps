<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HealthFind SA</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="clinic_app.css">
</head>
<body>

<header class="topbar"></header>

<!-- HEADER -->
<header class="header">
  <section class="header-inner">
    <figure class="brand">
      <i class="brand-mark">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
      </i>
      <figcaption class="brand-name">
        <b>HealthFind SA</b>
        <small>Community Clinic Directory</small>
      </figcaption>
    </figure>
    <nav class="nav">
      <button class="nav-btn active" id="clinicsBtn">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Find Clinics
      </button>
      <button class="nav-btn" id="bookingsBtn">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        My Bookings
      </button>
    </nav>
  </section>
</header>

<main class="main">
  <section id="content">
    <figure class="loading-wrap"><i class="spinner"></i><b class="loading-label">Loading clinics…</b></figure>
  </section>
</main>

<!-- REVIEW MODAL -->
<dialog class="modal-backdrop" id="reviewModal">
  <article class="modal-panel">
    <hr class="modal-top-bar">
    <section class="modal-body">
      <button class="modal-close-btn" id="closeModalBtn">✕</button>
      <h2 class="modal-heading">Submit a Review</h2>
      <p class="modal-sub" id="reviewClinicName"></p>
      <fieldset class="star-group" id="starContainer">
        <b class="star" data-rating="1">★</b>
        <b class="star" data-rating="2">★</b>
        <b class="star" data-rating="3">★</b>
        <b class="star" data-rating="4">★</b>
        <b class="star" data-rating="5">★</b>
      </fieldset>
      <textarea class="modal-textarea" id="reviewComment" rows="4" placeholder="Describe your experience at this facility…"></textarea>
      <button class="modal-submit" id="submitReviewBtn">Submit Review</button>
    </section>
  </article>
</dialog>

<script type="module" src="../backend/clinic_app.js"></script>
</body>
</html>
