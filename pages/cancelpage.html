<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Appointments | Health-Flow</title>
  <link rel="stylesheet" href="shared.css" />
  <script src="https://unpkg.com/@supabase/supabase-js@2.39.0/dist/umd/supabase.js"></script>
  <style>
    .appt-list { display: flex; flex-direction: column; gap: 12px; }

    .appt-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      overflow: hidden;
      transition: border-color 0.15s;
    }
    .appt-card:hover { border-color: var(--text-muted); }

    .appt-card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      gap: 12px;
    }
    .appt-num {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-muted);
      letter-spacing: 0.04em;
    }

    .appt-body {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 0;
    }
    .appt-field {
      padding: 12px 16px;
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }
    .appt-field:last-child { border-right: none; }
    .appt-field-label {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 4px;
    }
    .appt-field-value { font-size: 12px; color: var(--text); }

    .appt-footer {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 10px 16px;
      border-top: 1px solid var(--border);
      background: var(--surface2);
    }

    .loading-message, .info-message, .error-message {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 20px;
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
    }
    .error-message { color: var(--accent2); border-color: rgba(255,107,107,0.3); background: rgba(255,107,107,0.06); }
  </style>
</head>
<body>

  <header class="topbar">
    <span class="brand">
      <span class="brand-icon">✚</span>
      <strong class="brand-name">Health-Flow</strong>
    </span>
    <div class="topbar-right">
      <button class="btn btn-outline" onclick="window.location.href='dashboard.html'">← Dashboard</button>
    </div>
  </header>

  <main class="page-wide" id="main-content">
    <div class="section-label" style="margin-bottom:6px;">My Appointments</div>
    <p style="font-size:11px;color:var(--text-muted);margin-bottom:20px;">View all your appointments and manage them here.</p>

    <div id="appointmentsContainer" class="appt-list" aria-live="polite">
      <p class="loading-message"><span class="spinner"></span>Loading your appointments…</p>
    </div>
  </main>

  <script type="module" src="cancelpage.js"></script>
</body>
</html>
