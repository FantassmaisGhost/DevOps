<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>My Appointments | Health-Flow</title>

  <link rel="stylesheet" href="shared.css" />

  <script src="https://unpkg.com/@supabase/supabase-js@2.39.0/dist/umd/supabase.js"></script>

  <style>
    .appt-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .appt-card {
      background: var(--surface);
      border: 1.5px solid var(--border-md);
      border-radius: var(--radius-md);
      overflow: hidden;
      transition: border-color 0.15s, box-shadow 0.15s;
      box-shadow: var(--shadow-sm);
    }

    .appt-card:hover {
      border-color: var(--teal);
      box-shadow: var(--shadow-md);
    }

    .appt-card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 13px 18px;
      border-bottom: 1px solid var(--border);
      background: var(--surface2);
      gap: 12px;
    }

    .appt-num {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--ink-3);
      letter-spacing: 0.06em;
    }

    .appt-body {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    }

    .appt-field {
      padding: 14px 18px;
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }

    .appt-field:last-child {
      border-right: none;
    }

    .appt-field-label {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ink-3);
      margin-bottom: 5px;
    }

    .appt-field-value {
      font-size: 13px;
      color: var(--ink);
      font-weight: 500;
    }

    .appt-footer {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 11px 18px;
      border-top: 1px solid var(--border);
      background: var(--surface2);
    }

    .loading-message,
    .info-message,
    .error-message {
      background: var(--surface);
      border: 1.5px solid var(--border-md);
      border-radius: var(--radius-md);
      padding: 24px;
      text-align: center;
      font-size: 13px;
      color: var(--ink-3);
      font-style: italic;
    }

    .error-message {
      color: var(--rust);
      border-color: rgba(185,74,30,0.25);
      background: var(--rust-light);
    }

    .btn-cancel-appt {
      font-family: var(--font-body);
      font-size: 12px;
      font-weight: 700;
      padding: 7px 14px;
      border-radius: var(--radius-sm);
      border: 1.5px solid rgba(185,74,30,0.25);
      background: var(--rust-light);
      color: var(--rust);
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-cancel-appt:hover:not(:disabled) {
      background: #FAE8E0;
    }

    .btn-cancel-appt:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      background: var(--surface2);
      color: var(--ink-3);
      border-color: var(--border-md);
    }

    .page-intro {
      font-size: 12px;
      color: var(--ink-3);
      margin-bottom: 24px;
      line-height: 1.6;
    }
  </style>
</head>

<body>

  <header class="topbar">

    <h1 class="brand">

      <span class="brand-icon">✚</span>

      <strong class="brand-name">
        Health-Flow
      </strong>

    </h1>

    <nav class="topbar-right" aria-label="Dashboard navigation">

      <button class="btn btn-outline"
              onclick="window.location.href='dashboard.html'">
        ← Dashboard
      </button>

    </nav>

  </header>

  <main class="page-wide" id="main-content">

    <header>

      <h2 class="section-label" style="margin-bottom:6px;">
        My Appointments
      </h2>

      <p class="page-intro">
        View all your appointments and manage them here.
      </p>

    </header>

    <section id="appointmentsContainer"
             class="appt-list"
             aria-live="polite">

      <p class="loading-message">

        <span class="spinner"></span>

        Loading your appointments…

      </p>

    </section>

  </main>

  <script type="module" src="cancelpage.js"></script>

</body>
</html>
