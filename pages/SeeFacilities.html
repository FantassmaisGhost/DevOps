<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Facilities | Health-Flow Admin</title>
  <link rel="stylesheet" href="shared.css" />
  <style>
    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      overflow: hidden;
      margin-bottom: 16px;
    }
    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 11px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--surface2);
    }
    .panel-title {
      font-family: var(--font-mono);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    .panel-sub { font-size: 10px; color: var(--text-muted); }
    .panel-body { padding: 16px; }

    .staff-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      font-size: 12px;
    }
    .staff-row:last-child { border-bottom: none; }
    .staff-info { flex: 1; }
    .staff-name { font-weight: 700; margin-bottom: 2px; }
    .staff-meta { font-size: 10px; color: var(--text-muted); }

    .form-input {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 7px 10px;
      width: 100%;
      outline: none;
      transition: border-color 0.15s;
    }
    .form-input:focus { border-color: var(--accent); }

    .action-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      gap: 14px;
    }
    .action-card:last-child { border-bottom: none; }
    .action-title { font-size: 13px; font-weight: 700; margin-bottom: 2px; }
    .action-desc  { font-size: 11px; color: var(--text-muted); }

    #toast {
      position: fixed; bottom: 20px; right: 20px;
      padding: 11px 18px; border-radius: var(--radius-md);
      font-size: 12px; border: 1px solid var(--border);
      background: var(--surface); box-shadow: var(--shadow);
      display: none; z-index: 1000;
    }
  </style>
</head>
<body>

  <header class="topbar">
    <span class="brand">
      <span class="brand-icon">✚</span>
      <strong class="brand-name">Health-Flow</strong>
    </span>
    <div class="topbar-right">
      <span class="role-badge badge-admin">Admin</span>
      <a href="admin-dashboard.html" class="btn btn-outline">← Admin Dashboard</a>
    </div>
  </header>

  <main class="page">
    <section id="dynamic-content">
      <div class="loading-state">
        <div class="spinner"></div>
        <div style="margin-top:10px;font-size:12px;color:var(--text-muted);">Loading facility information…</div>
      </div>
    </section>

    <div class="panel">
      <div class="panel-head">
        <span class="panel-title">Pending Staff Approvals</span>
        <span class="panel-sub">Staff awaiting approval for this clinic</span>
      </div>
      <div id="pending-staff-container" class="panel-body">
        <div class="loading-state" style="padding:24px 0;"><div class="spinner"></div></div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <span class="panel-title">Current Staff Members</span>
        <span class="panel-sub" id="current-clinic-display" style="font-family:var(--font-mono);"></span>
      </div>
      <div style="padding:12px 16px 0;font-size:10px;color:var(--text-muted);">
        Staff are added when they register. Remove to revoke access.
      </div>
      <div id="staff-list-container">
        <div class="loading-state" style="padding:24px 0;"><div class="spinner"></div></div>
      </div>
    </div>
  </main>

  <div id="toast"></div>

  <script type="module" src="../backend/SeeFacilities.js"></script>
</body>
</html>
