<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Set Availability | Health-Flow</title>
    <link rel="stylesheet" href="shared.css" />
    <link rel="stylesheet" href="../styles/staff-unavailability.css" />
</head>
<body>
    <header class="topbar">
        <h1 class="brand">
            <span class="brand-icon">✚</span>
            <strong class="brand-name">Health-Flow</strong>
        </h1>

        <nav class="topbar-right" aria-label="User menu">
            <p id="userEmail" style="font-size:11px;color:rgba(247,244,238,0.4);">
                Loading…
            </p>

            <button class="btn btn-ghost" id="logoutBtn">
                Logout
            </button>
        </nav>
    </header>

    <main class="availability-container" style="max-width:800px; margin:40px auto; padding:0 20px;">
        
        <header class="page-header" style="display:flex; align-items:center; gap:12px; margin-bottom:26px;">
            <a href="staff-dashboard.html"
               class="back-link"
               style="background:none; border:1px solid var(--border-md); color:var(--ink-3); padding:6px 14px; border-radius:var(--radius-sm); text-decoration:none;">
                ← Back
            </a>

            <h2 style="font-size:22px; margin:0;">
                📅 Manage Unavailability
            </h2>
        </header>

        <p class="page-subtext"
           style="margin-bottom:24px; font-size:14px; color:var(--ink-3);">
            Mark dates and times when you are <strong>not available</strong>.
            Patients won't be able to book you during these periods.
        </p>

        <section class="form-card"
                 style="background:var(--surface); border:1.5px solid var(--border-md); border-radius:var(--radius-md); padding:22px; margin-bottom:28px;">

            <h3 style="margin:0 0 16px;">
                ➕ Add Unavailable Period
            </h3>

            <form class="form-row"
                  style="display:grid; grid-template-columns:repeat(3,1fr); gap:12px;">

                <fieldset class="form-group">
                    <label for="inputDate">Date</label>
                    <input type="date" id="inputDate" class="input" />
                </fieldset>

                <fieldset class="form-group">
                    <label for="inputStart">Start Time</label>
                    <input type="time" id="inputStart" class="input" />
                </fieldset>

                <fieldset class="form-group">
                    <label for="inputEnd">End Time</label>
                    <input type="time" id="inputEnd" class="input" />
                </fieldset>
            </form>

            <p class="hint" style="font-size:12px; color:var(--ink-4);">
                Leave start and end empty to mark entire day.
            </p>

            <button class="btn-primary"
                    id="addBtn"
                    style="width:100%; margin-top:14px;">
                Save Unavailable Period
            </button>
        </section>

        <section class="unavail-list"
                 style="background:var(--surface); border:1.5px solid var(--border-md); border-radius:var(--radius-md); overflow:hidden;">

            <h3 style="margin:0; padding:16px 20px; font-size:16px; border-bottom:1px solid var(--border);">
                🗓 Your Unavailable Periods
            </h3>

            <section id="unavailList" style="padding:0;">
                <p class="loading-state" style="padding:40px; text-align:center;">
                    Loading...
                </p>
            </section>
        </section>
    </main>

    <aside id="toast" class="toast" aria-live="polite"></aside>

    <script type="module" src="../backend/staff-unavailability.js"></script>
</body>
</html>
