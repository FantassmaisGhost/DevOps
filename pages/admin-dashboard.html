<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard | Health-Flow</title>

  <link rel="stylesheet" href="shared.css" />

  <style>
    .admin-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 14px;
      margin-top: 24px;
    }

    .admin-card {
      background: var(--surface);
      border: 1.5px solid var(--border-md);
      border-radius: var(--radius-md);
      overflow: hidden;
      transition: border-color 0.15s, box-shadow 0.2s, transform 0.15s;
      box-shadow: var(--shadow-sm);
    }

    .admin-card:hover {
      border-color: var(--teal);
      box-shadow: var(--shadow-md);
      transform: translateY(-2px);
    }

    .admin-card-head {
      padding: 16px 20px 14px;
      display: flex;
      align-items: center;
      gap: 14px;
      border-bottom: 1px solid var(--border);
      background: var(--surface2);
    }

    .admin-card-icon {
      width: 38px;
      height: 38px;
      background: var(--teal-light);
      border: 1.5px solid rgba(0,137,123,0.2);
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
      margin: 0;
    }

    .admin-card-title {
      font-family: var(--font-disp);
      font-size: 15px;
      font-weight: 700;
      color: var(--ink);
      margin: 0;
    }

    .admin-card-body {
      padding: 16px 20px;
    }

    .admin-card-desc {
      font-size: 12px;
      color: var(--ink-3);
      line-height: 1.55;
      margin-bottom: 16px;
    }

    .portal-banner {
      background: var(--obsidian);
      border-radius: var(--radius-md);
      padding: 24px 28px;
      margin-bottom: 32px;
      position: relative;
      overflow: hidden;
      box-shadow: var(--shadow-md);
    }

    .portal-banner::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(247,244,238,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(247,244,238,0.03) 1px, transparent 1px);
      background-size: 28px 28px;
    }

    .portal-banner::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--ochre-mid), var(--teal));
    }

    .portal-title {
      font-family: var(--font-disp);
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 4px;
      color: #F7F4EE;
      position: relative;
      z-index: 1;
    }

    .portal-sub {
      font-size: 11px;
      color: rgba(247,244,238,0.4);
      position: relative;
      z-index: 1;
      letter-spacing: 0.04em;
    }
  </style>
</head>
