<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Clinic Appointments | Health-Flow</title>

  <link rel="stylesheet" href="shared.css" />

  <style>
    .toolbar {
      display: flex;
      gap: 12px;
      margin-bottom: 18px;
      align-items: center;
      flex-wrap: wrap;
    }

    .toolbar .input {
      max-width: 360px;
    }

    .appointment-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .muted {
      color: var(--ink-3);
      font-size: 12px;
    }
  </style>
</head>

<body>

  <header class="topbar">
    <section class="brand" aria-label="Application branding">
      <span class="brand-icon">✚</span>
      <strong class="brand-name">Health-Flow</strong>
    </section>

    <nav class="topbar-right" aria-label="Receptionist actions">
      <output id="userEmail" style="font-size:11px;color:rgba(247,244,238,0.4);">
        Loading…
      </output>

      <span class="role-badge badge-receptionist">Receptionist</span>

      <a href="receptionist-dashboard.html" class="btn btn-outline">
        ← Dashboard
      </a>

      <button class="btn btn-ghost" id="logoutBtn">
        Sign out
      </button>
    </nav>
  </header>

  <main class="page-wide">

    <section aria-labelledby="page-heading">
      <header class="section-label">
        Appointments
      </header>

      <h1 id="page-heading" style="font-family:var(--font-disp);margin-bottom:6px;">
        Clinic Appointments
      </h1>

      <p class="muted" id="clinicName">
        Loading clinic appointments…
      </p>
    </section>

    <section class="toolbar" aria-label="Appointment search controls">
      <input
        type="search"
        id="searchInput"
        class="input"
        placeholder="Search patient name, email, reason, or status…"
      />

      <button class="btn btn-primary" id="refreshBtn">
        Refresh
      </button>
    </section>

    <section class="table-wrap" aria-labelledby="appointments-table-heading">
      <h2 id="appointments-table-heading" hidden>
        Appointment List
      </h2>

      <table>
        <thead>
          <tr>
            <th>Patient</th>
            <th>Email</th>
            <th>Date</th>
            <th>Time</th>
            <th>Reason</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>

        <tbody id="appointmentsBody">
          <tr>
            <td colspan="7" class="empty-state">
              Loading appointments…
            </td>
          </tr>
        </tbody>
      </table>
    </section>

  </main>

  <script type="module" src="../backend/receptionist-appointments.js"></script>
  <script type="module" src="../backend/nav.js"></script>

</body>
</html>
