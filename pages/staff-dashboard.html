<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Staff Dashboard | Health-Flow</title>
  <link rel="stylesheet" href="shared.css" />
  <style>
    .info-card {
      background: var(--surface);
      border: 1.5px solid var(--border-md);
      border-radius: var(--radius-md);
      overflow: hidden;
      margin-bottom: 14px;
      box-shadow: var(--shadow-sm);
    }
    .info-row {
      display: flex;
      align-items: center;
      padding: 12px 18px;
      border-bottom: 1px solid var(--border);
      gap: 16px;
      font-size: 13px;
    }
    .info-row:last-child { border-bottom: none; }
    .info-label {
      width: 140px; flex-shrink: 0;
      font-size: 9px; font-weight: 700;
      letter-spacing: 0.09em; text-transform: uppercase;
      color: var(--ink-3);
    }
    .info-value { color: var(--ink); flex: 1; font-weight: 500; }
    .action-buttons { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 20px; }

    .welcome-banner {
      background: var(--obsidian);
      border-radius: var(--radius-md);
      padding: 24px 28px;
      margin-bottom: 28px;
      position: relative; overflow: hidden;
      box-shadow: var(--shadow-md);
    }
    .welcome-banner::before {
      content: '';
      position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(247,244,238,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(247,244,238,0.03) 1px, transparent 1px);
      background-size: 28px 28px;
    }
    .welcome-banner::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0; height: 3px;
      background: linear-gradient(90deg, var(--teal), var(--cerulean));
    }
    .banner-title {
      font-family: var(--font-disp);
      font-size: 22px; font-weight: 700;
      color: #F7F4EE; letter-spacing: -0.02em;
      position: relative; z-index: 1;
    }
    .banner-sub {
      font-size: 11px; color: rgba(247,244,238,0.4);
      position: relative; z-index: 1; margin-top: 4px;
    }
  </style>
</head>
<body>

  <header class="topbar">
    <span class="brand">
      <span class="brand-icon">✚</span>
      <strong class="brand-name">Health-Flow</strong>
    </span>
    <div class="topbar-right">
      <span id="userEmail" style="font-size:11px;color:rgba(247,244,238,0.4);">Loading…</span>
      <span class="role-badge badge-staff">Staff</span>
      <button class="btn btn-ghost" id="logoutBtn">Sign out</button>
    </div>
  </header>

  <main class="page-wide" id="dashboardContent">
    <div class="loading-state">
      <div class="spinner"></div>
      <div style="margin-top:10px;font-size:13px;color:var(--ink-3);">Loading staff dashboard…</div>
    </div>
  </main>

  <script type="module" src="../backend/staff-dashboard.js"></script>
</body>
</html>
