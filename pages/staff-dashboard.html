<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Dashboard | Health-Flow</title>

    <link rel="stylesheet" href="shared.css">
    <link rel="stylesheet" href="../styles/staff-dashboard.css">

    <style>
        .welcome-banner {
            background: linear-gradient(135deg, #1a2a3d 0%, #111520 100%);
            border-radius: var(--radius-md);
            padding: 28px 32px;
            margin-bottom: 28px;
            border: 1px solid var(--border-md);
        }

        .welcome-banner h2 {
            font-size: 24px;
            color: #F7F4EE;
            margin-bottom: 8px;
        }

        .welcome-banner p {
            color: var(--ink-3);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin-bottom: 28px;
        }

        .action-bar {
            background: var(--surface);
            border: 1.5px solid var(--border-md);
            border-radius: var(--radius-md);
            padding: 16px 24px;
            margin-bottom: 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }

        .action-info h4 {
            font-size: 14px;
            font-weight: 600;
            color: var(--ink);
            margin-bottom: 4px;
        }

        .action-info p {
            font-size: 12px;
            color: var(--ink-3);
            margin: 0;
        }

        .action-buttons-group {
            display: flex;
            gap: 12px;
        }

        .info-card {
            background: var(--surface);
            border: 1.5px solid var(--border-md);
            border-radius: var(--radius-md);
            padding: 22px 26px;
            margin-bottom: 24px;
        }

        .info-card h3 {
            font-size: 13px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--ink-3);
            margin-bottom: 16px;
        }

        .info-row {
            display: flex;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            width: 130px;
            font-weight: 600;
            color: var(--ink-2);
            font-size: 13px;
        }

        .info-value {
            flex: 1;
            color: var(--ink);
        }

        .section-header-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .section-header-actions h3 {
            font-size: 13px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--ink-3);
            margin: 0;
        }

        .appointments-table {
            width: 100%;
            border-collapse: collapse;
        }

        .appointments-table th {
            text-align: left;
            padding: 12px 8px;
            border-bottom: 1px solid var(--border);
            color: var(--ink-3);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .appointments-table td {
            padding: 12px 8px;
            border-bottom: 1px solid var(--border);
            font-size: 13px;
        }

        .row-clash {
            background: rgba(124, 92, 191, 0.08);
        }

        .btn-small {
            padding: 4px 8px;
            font-size: 12px;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: var(--teal);
            color: var(--obsidian);
            padding: 12px 22px;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.25s;
            pointer-events: none;
            z-index: 1000;
        }

        .toast.error {
            background: var(--rust);
            color: white;
        }

        .toast.show {
            opacity: 1;
        }

        dialog#rescheduleModal {
            background: transparent;
            border: none;
            padding: 0;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            margin: 0;
        }

        dialog#rescheduleModal::backdrop {
            background: rgba(0,0,0,0.7);
        }

        .modal-box {
            background: var(--surface);
            border: 1.5px solid var(--border-md);
            border-radius: var(--radius-md);
            padding: 28px;
            width: 420px;
            max-width: 90vw;
        }

        .modal-box h3 {
            margin-top: 0;
            font-size: 20px;
        }

        .modal-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin: 20px 0;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 8px;
        }

        .modal-error {
            color: var(--rust);
            font-size: 13px;
            margin: 8px 0 0;
        }

        @media (max-width: 640px) {
            .welcome-banner {
                padding: 20px;
            }

            .info-row {
                flex-direction: column;
                gap: 4px;
            }

            .info-label {
                width: auto;
            }

            .action-bar {
                flex-direction: column;
                align-items: flex-start;
            }
        }

        /* Patient Notes System Styles (starts here) */
        .view-notes-btn {
        background: none;
        border: 1px solid var(--teal);
        color: var(--teal);
        padding: 2px 8px;
        border-radius: var(--radius-sm);
        cursor: pointer;
        font-size: 11px;
        font-weight: 600;
        transition: all 0.15s;
        display: inline-flex;
        align-items: center;
        gap: 6px;
    }

    .view-notes-btn:hover {
        background: var(--teal);
        color: #fff;
    }

    .note-count-badge {
        background: var(--teal);
        color: white;
        font-size: 10px;
        font-weight: 700;
        padding: 2px 6px;
        border-radius: 10px;
        margin-left: 4px;
    }

    .notes-modal .modal-box {
        max-width: 550px;
        width: 90%;
    }

    .notes-history {
        max-height: 350px;
        overflow-y: auto;
        margin: 16px 0;
        background: var(--surface2);
        border-radius: var(--radius-sm);
        padding: 12px;
    }

    .note-item {
        padding: 12px;
        border-bottom: 1px solid var(--border);
        margin-bottom: 8px;
    }

    .note-item:last-child {
        border-bottom: none;
        margin-bottom: 0;
    }

    .note-text {
        font-size: 13px;
        line-height: 1.5;
        margin-bottom: 6px;
        color: var(--ink);
    }

    .note-meta {
        font-size: 10px;
        color: var(--ink-3);
        display: flex;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 8px;
    }

    .new-note-input {
        width: 100%;
        padding: 10px;
        border-radius: var(--radius-sm);
        border: 1.5px solid var(--border-md);
        background: var(--surface2);
        color: var(--ink);
        font-family: var(--font-body);
        font-size: 12px;
        resize: vertical;
        margin-bottom: 12px;
    }

    .notes-cell {
        text-align: center;
        white-space: nowrap;
    }
    /* Patient Notes System Styles (ends here)*/

    </style>
</head>

<body>

<header class="topbar">

    <section class="brand">

        <figure class="brand-icon" aria-hidden="true">
            ✚
        </figure>

        <strong class="brand-name">
            Health-Flow
        </strong>

    </section>

    <nav class="topbar-right">

        <output
            id="userEmail"
            style="font-size:11px;color:rgba(247,244,238,0.4);"
        >
            Loading…
        </output>

        <p class="role-badge badge-staff">
            Staff
        </p>

        <button class="btn btn-ghost" id="logoutBtn">
            Sign out
        </button>

    </nav>

</header>

<main class="page-wide" id="dashboardContent">

    <section class="loading-state">

        <progress
            class="spinner"
            aria-label="Loading staff dashboard"
        ></progress>

        <p style="margin-top:10px;">
            Loading staff dashboard…
        </p>

    </section>

</main>

<aside id="toast" class="toast"></aside>

<script type="module" src="../backend/staff-dashboard.js"></script>

</body>
</html>
