<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Appointments | Health-Flow</title>
  <link rel="stylesheet" href="shared.css" />
  <style>
    .search-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(247,244,238,0.08);
      border: 1.5px solid rgba(247,244,238,0.14);
      border-radius: var(--radius-sm);
      padding: 0 12px;
      height: 34px;
      flex: 1;
      max-width: 260px;
    }
    .search-wrap span { font-size: 13px; color: rgba(247,244,238,0.35); }
    .search-wrap input {
      background: none; border: none; outline: none;
      color: #F7F4EE;
      font-family: var(--font-body);
      font-size: 12px; width: 100%;
    }
    .search-wrap input::placeholder { color: rgba(247,244,238,0.3); }

    .action-btn-cell {
      display: inline-flex; align-items: center; gap: 6px;
      font-family: var(--font-body);
      font-size: 11px; font-weight: 700;
      padding: 5px 10px;
      border-radius: var(--radius-sm);
      border: 1.5px solid rgba(185,74,30,0.25);
      background: var(--rust-light);
      color: var(--rust);
      cursor: pointer; transition: all 0.15s; white-space: nowrap;
    }
    .action-btn-cell:hover:not(:disabled) { background: #FAE8E0; }
    .action-btn-cell:disabled, .action-btn-cell.disabled {
      opacity: 0.4; cursor: not-allowed;
      background: var(--surface2); color: var(--ink-3);
      border-color: var(--border-md);
    }

    .topbar-inner { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .pagination {
      padding: 10px 16px;
      font-size: 10px; font-weight: 600;
      color: var(--ink-3);
      border-top: 1px solid var(--border);
      letter-spacing: 0.04em;
    }

    #statTotal    { color: var(--ink); }
    #statCompleted { color: var(--forest); }
    #statScheduled { color: var(--cerulean); }
    #statCancelled { color: var(--rust); }

    .stat-card {
      cursor: pointer;
      transition: border-color 0.15s, box-shadow 0.15s, transform 0.12s;
      user-select: none;
    }
    .stat-card:hover { border-color: var(--teal); box-shadow: var(--shadow-md); transform: translateY(-1px); }
    .stat-card.stat-active { border-color: var(--teal); box-shadow: 0 0 0 3px rgba(0,137,123,0.12), var(--shadow-md); }
    .stat-card.stat-active-completed  { border-color: var(--forest); box-shadow: 0 0 0 3px rgba(26,92,58,0.12), var(--shadow-md); }
    .stat-card.stat-active-cancelled  { border-color: var(--rust);   box-shadow: 0 0 0 3px rgba(185,74,30,0.12), var(--shadow-md); }
    .stat-filter-hint {
      font-size: 9px; font-weight: 700; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--teal);
      margin-top: 4px; display: none;
    }
    .stat-card.stat-active .stat-filter-hint,
    .stat-card.stat-active-completed .stat-filter-hint,
    .stat-card.stat-active-cancelled .stat-filter-hint { display: block; }
  </style>
</head>
<body>

  <header class="topbar">
    <span class="brand">
      <span class="brand-icon">✚</span>
      <strong class="brand-name">Health-Flow</strong>
    </span>
    <div class="topbar-right topbar-inner">
      <span class="search-wrap">
        <span>⌕</span>
        <input id="searchInput" placeholder="Search…" />
      </span>
      <span id="userPill" style="font-size:10px;color:rgba(247,244,238,0.4);display:none;"></span>
      <button id="refreshBtn" class="btn btn-primary" style="background:rgba(247,244,238,0.1);color:#F7F4EE;border-color:rgba(247,244,238,0.2);">↺ Refresh</button>
      <button id="dashboardBtn" class="btn btn-outline">← Dashboard</button>
      <button id="logoutBtn" class="btn btn-ghost">Sign out</button>
    </div>
  </header>

  <main class="page-wide">
    <div class="section-label" style="margin-bottom:16px;">My Bookings</div>

    <div class="stats-grid" style="margin-bottom:24px;">
      <div class="stat-card" id="cardTotal"     data-filter="all">
        <div class="stat-val" id="statTotal">—</div>
        <div class="stat-key">Total</div>
        <div class="stat-filter-hint">Showing all</div>
      </div>
      <div class="stat-card" id="cardCompleted" data-filter="completed">
        <div class="stat-val" id="statCompleted">—</div>
        <div class="stat-key">Completed</div>
        <div class="stat-filter-hint">Filtered ✓</div>
      </div>
      <div class="stat-card" id="cardScheduled" data-filter="scheduled">
        <div class="stat-val" id="statScheduled">—</div>
        <div class="stat-key">Scheduled</div>
        <div class="stat-filter-hint">Filtered ✓</div>
      </div>
      <div class="stat-card" id="cardCancelled" data-filter="cancelled">
        <div class="stat-val" id="statCancelled">—</div>
        <div class="stat-key">Cancelled</div>
        <div class="stat-filter-hint">Filtered ✓</div>
      </div>
    </div>

    <div class="table-wrap">
      <table>
        <thead id="tableHead"></thead>
        <tbody id="tableBody">
          <tr><td class="empty-state" colspan="8"><span class="spinner"></span> Checking session…</td></tr>
        </tbody>
      </table>
      <div class="pagination" id="paginationBar"></div>
    </div>
  </main>

  <!-- Cancel confirmation modal -->
  <div class="modal-overlay hidden" id="cancelModal">
    <div class="modal-box">
      <div class="modal-title">Cancel Appointment</div>
      <div class="modal-body">Are you sure you want to cancel this appointment? This action cannot be undone.</div>
      <div class="modal-actions">
        <button id="closeModalBtn" class="btn" style="background:var(--surface2);color:var(--ink-2);border:1.5px solid var(--border-md);">Keep it</button>
        <button id="confirmCancelBtn" class="btn btn-danger">Yes, cancel</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { supabase } from '../backend/supabase.js';

    let allData = [], filteredData = [], columns = [], sortCol = null, sortAsc = true, activeFilter = 'all';

    const columnLabels = {
      "Staff.full_name": "Doctor", "Facilities.Name": "Clinic",
      reason: "Reason", status: "Status", ClinicID: "Clinic ID",
      appointment_date: "Date", appointment_time: "Time", actions: "Actions"
    };

    function escHtml(s) {
      if (!s) return '';
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function getValue(row, col) {
      if (col === "actions") return row.id;
      if (col.includes(".")) return col.split(".").reduce((o, k) => o?.[k], row);
      return row[col];
    }

    function statusPill(val) {
      const s = String(val).toLowerCase();
      const map = { completed: 'pill-completed', scheduled: 'pill-scheduled', cancelled: 'pill-cancelled', waiting: 'pill-waiting' };
      return `<span class="pill ${map[s] || 'pill-waiting'}">${escHtml(String(val))}</span>`;
    }

    function renderAction(row) {
      const s = String(row.status || "").toLowerCase();
      if (s === "cancelled" || s === "completed")
        return `<button class="action-btn-cell disabled" disabled>${s === "cancelled" ? "Cancelled" : "Unavailable"}</button>`;
      return `<button class="action-btn-cell" type="button" data-appointment-id="${escHtml(String(row.id))}">✕ Cancel</button>`;
    }

    function buildHead() {
      document.getElementById("tableHead").innerHTML = "<tr>" + columns.map(c =>
        c === "actions" ? `<th>${columnLabels[c]}</th>`
        : `<th data-sort="${c}" class="sortable">${columnLabels[c] || c} ↕</th>`
      ).join("") + "</tr>";
    }

    function updateStats() {
      const count = v => allData.filter(r => String(r.status || "").toLowerCase() === v).length;
      // "scheduled" bucket includes "waiting" and "pending" — any non-terminal active status
      const scheduledCount = allData.filter(r => {
        const s = String(r.status || "").toLowerCase();
        return s === "scheduled" || s === "waiting" || s === "pending" || s === "confirmed";
      }).length;
      document.getElementById("statTotal").textContent = allData.length;
      document.getElementById("statCompleted").textContent = count("completed");
      document.getElementById("statScheduled").textContent = scheduledCount;
      document.getElementById("statCancelled").textContent = count("cancelled");
    }

    function setActiveFilter(filter) {
      activeFilter = filter;
      const cards = { all: 'cardTotal', completed: 'cardCompleted', scheduled: 'cardScheduled', cancelled: 'cardCancelled' };
      const activeClasses = { all: 'stat-active', completed: 'stat-active-completed', scheduled: 'stat-active', cancelled: 'stat-active-cancelled' };
      Object.entries(cards).forEach(([f, id]) => {
        const el = document.getElementById(id);
        el.classList.remove('stat-active', 'stat-active-completed', 'stat-active-cancelled');
        if (f === filter) el.classList.add(activeClasses[f]);
      });
      applyFilters();
    }

    function applyFilters() {
      const q = document.getElementById("searchInput").value.trim().toLowerCase();
      filteredData = allData.filter(row => {
        const s = String(row.status || "").toLowerCase();
        if (activeFilter === 'scheduled') {
          if (s !== 'scheduled' && s !== 'waiting' && s !== 'pending' && s !== 'confirmed') return false;
        } else if (activeFilter !== 'all') {
          if (s !== activeFilter) return false;
        }
        return !q || columns.some(c => c !== "actions" && String(getValue(row, c) ?? "").toLowerCase().includes(q));
      });
      if (sortCol) {
        filteredData.sort((a, b) => {
          const va = String(getValue(a, sortCol) ?? "").toLowerCase();
          const vb = String(getValue(b, sortCol) ?? "").toLowerCase();
          return sortAsc ? va.localeCompare(vb) : vb.localeCompare(va);
        });
      }
      render();
    }

    function sortBy(col) {
      sortAsc = sortCol === col ? !sortAsc : true;
      sortCol = col;
      applyFilters();
    }

    function render() {
      if (!allData.length) {
        document.getElementById("tableBody").innerHTML = `<tr><td class="empty-state" colspan="${columns.length}"><div class="empty-icon">📋</div>No appointments found for your account.</td></tr>`;
        document.getElementById("paginationBar").textContent = "0 rows";
        return;
      }
      if (!filteredData.length) {
        document.getElementById("tableBody").innerHTML = `<tr><td class="empty-state" colspan="${columns.length}">No matching records.</td></tr>`;
        document.getElementById("paginationBar").textContent = `0 of ${allData.length} rows`;
        return;
      }
      document.getElementById("tableBody").innerHTML = filteredData.map(row =>
        "<tr>" + columns.map(c => {
          if (c === "actions") return "<td>" + renderAction(row) + "</td>";
          const v = getValue(row, c);
          if (v === null || v === undefined || v === "") return "<td style='color:var(--ink-4)'>—</td>";
          if (c === "status") return "<td>" + statusPill(v) + "</td>";
          return "<td>" + escHtml(String(v)) + "</td>";
        }).join("") + "</tr>"
      ).join("");
      document.getElementById("paginationBar").textContent = `${filteredData.length} of ${allData.length} row${allData.length === 1 ? "" : "s"}`;
    }

    async function loadData(email) {
      if (!email) {
        const { data: { session } } = await supabase.auth.getSession();
        if (!session) { window.location.href = 'index.html'; return; }
        email = session.user.email;
      }
      document.getElementById("tableBody").innerHTML = '<tr><td class="empty-state" colspan="8"><span class="spinner"></span>Loading…</td></tr>';
      const { data, error } = await supabase.from("Appointments")
        .select("id, reason, status, appointment_date, appointment_time, ClinicID, Staff(full_name), Facilities(Name)")
        .eq("patient_email", email)
        .order("appointment_date", { ascending: true }).order("appointment_time", { ascending: true });
      if (error) {
        document.getElementById("tableBody").innerHTML = `<tr><td class="empty-state" colspan="8" style="color:var(--rust);">Error: ${escHtml(error.message)}</td></tr>`;
        return;
      }
      allData = data || [];
      columns = ["Staff.full_name", "Facilities.Name", "reason", "status", "ClinicID", "appointment_date", "appointment_time", "actions"];
      buildHead();
      updateStats();
      applyFilters();
    }

    async function cancelAppointment(id, btn) {
      const orig = btn.textContent;
      btn.disabled = true;
      btn.textContent = "…";
      const { error } = await supabase.from("Appointments").update({ status: "cancelled" }).eq("id", id);
      if (error) {
        alert("Failed: " + error.message);
        btn.disabled = false;
        btn.textContent = orig;
        return;
      }
      await loadData();
    }

    // Modal logic
    let selId = null, selBtn = null;
    const modal = document.getElementById("cancelModal");
    function openModal(id, btn) { selId = id; selBtn = btn; modal.classList.remove("hidden"); }
    function closeModal() { selId = null; selBtn = null; modal.classList.add("hidden"); }

    async function boot() {
      const { data: { session } } = await supabase.auth.getSession();
      if (!session) { window.location.href = 'index.html'; return; }
      document.getElementById("userPill").textContent = session.user.email;
      document.getElementById("userPill").style.display = '';
      await loadData(session.user.email);
    }

    // Event listeners
    document.getElementById("searchInput").addEventListener("input", () => applyFilters());
    document.getElementById("refreshBtn").addEventListener("click", () => loadData());
    document.getElementById("dashboardBtn").addEventListener("click", () => window.location.href = 'dashboard.html');
    document.getElementById("logoutBtn").addEventListener("click", async () => { await supabase.auth.signOut(); window.location.href = 'index.html'; });
    document.getElementById("closeModalBtn").addEventListener("click", closeModal);
    document.getElementById("confirmCancelBtn").addEventListener("click", async () => {
      if (selId && selBtn) await cancelAppointment(selId, selBtn);
      closeModal();
    });

    // Sort column listeners (event delegation)
    document.getElementById("tableHead").addEventListener("click", (e) => {
      const th = e.target.closest("th[data-sort]");
      if (th) sortBy(th.dataset.sort);
    });

    // Cancel button delegation
    document.getElementById("tableBody").addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-appointment-id]");
      if (!btn || btn.disabled) return;
      openModal(btn.dataset.appointmentId, btn);
    });

    // Stat card filter clicks
    ["cardTotal", "cardCompleted", "cardScheduled", "cardCancelled"].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.addEventListener("click", () => setActiveFilter(el.dataset.filter));
    });

    boot();
  </script>
  <script type="module" src="../backend/nav.js"></script>
</body>
</html>
