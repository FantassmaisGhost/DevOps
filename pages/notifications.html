<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notifications | Health-Flow</title>

  <link rel="stylesheet" href="shared.css" />

  <style>
    .notif-list {
      background: var(--surface);
      border: 1.5px solid var(--border-md);
      border-radius: var(--radius-md);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }

    .notif-item {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.12s;
      position: relative;
    }

    .notif-item:last-child {
      border-bottom: none;
    }

    .notif-item:hover {
      background: var(--surface2);
    }

    .notif-item.unread {
      background: var(--teal-light);
      border-left: 3px solid var(--teal);
    }

    .notif-item.unread:hover {
      background: #D4EDE9;
    }

    .notif-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 6px;
      flex-wrap: wrap;
    }

    .notif-type {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      padding: 2px 8px;
      border-radius: var(--radius-xs);
      background: var(--surface2);
      color: var(--ink-3);
    }

    .notif-type.appointment {
      color: var(--teal);
      background: var(--teal-light);
    }

    .notif-time {
      font-size: 10px;
      color: var(--ink-3);
      font-family: var(--font-mono);
    }

    .notif-msg {
      font-size: 13px;
      line-height: 1.55;
      margin-bottom: 8px;
      color: var(--ink);
    }

    .notif-actions {
      display: flex;
      gap: 14px;
    }

    .notif-action-btn {
      background: none;
      border: none;
      font-family: var(--font-body);
      font-size: 11px;
      font-weight: 700;
      color: var(--ink-3);
      cursor: pointer;
      transition: color 0.15s;
      padding: 0;
    }

    .notif-action-btn:hover {
      color: var(--teal);
    }

    .notif-action-btn.del:hover {
      color: var(--rust);
    }

    .filters {
      display: flex;
      gap: 6px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .filter-btn {
      font-family: var(--font-body);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.04em;
      padding: 6px 14px;
      border-radius: var(--radius-sm);
      border: 1.5px solid var(--border-md);
      background: var(--surface);
      color: var(--ink-3);
      cursor: pointer;
      transition: all 0.15s;
    }

    .filter-btn.active {
      background: var(--obsidian);
      color: #F7F4EE;
      border-color: var(--obsidian);
    }

    .filter-btn:hover:not(.active) {
      border-color: var(--teal);
      color: var(--teal);
    }

    .unread-badge {
      background: var(--teal);
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 999px;
      margin-left: 8px;
      display: none;
    }

    .page-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .page-title {
      font-family: var(--font-disp);
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--ink);
      display: flex;
      align-items: center;
    }

    .empty-state {
      padding: 56px 20px;
      text-align: center;
      color: var(--ink-3);
      font-size: 13px;
      font-style: italic;
    }

    .empty-icon {
      font-size: 36px;
      margin-bottom: 12px;
      opacity: 0.35;
    }

    .loading-state {
      text-align: center;
      padding: 56px 20px;
      color: var(--ink-3);
    }
  </style>
</head>

<body>

  <header class="topbar">

    <h1 class="brand">
      <em class="brand-icon">✚</em>
      <strong class="brand-name">Health-Flow</strong>
    </h1>

    <nav class="topbar-right" aria-label="Main navigation">
      <a href="dashboard.html" class="btn btn-outline">← Dashboard</a>

      <button id="logoutBtn" class="btn btn-ghost">
        Sign out
      </button>
    </nav>

  </header>

  <main class="page-wide">

    <header class="page-head">

      <h2 class="page-title">
        Notifications

        <b id="unreadBadge" class="unread-badge">
          0
        </b>
      </h2>

      <button id="markAllReadBtn"
              class="btn btn-primary"
              style="display:none;">
        Mark all read
      </button>

    </header>

    <nav class="filters" aria-label="Notification filters">

      <button class="filter-btn active"
              data-filter="all">
        All
      </button>

      <button class="filter-btn"
              data-filter="unread">
        Unread
      </button>

      <button class="filter-btn"
              data-filter="appointment">
        Appointments
      </button>

    </nav>

    <section id="notificationsContainer">

      <article class="loading-state">

        <figure class="spinner"></figure>

        <p style="margin-top:10px;font-size:13px;">
          Loading notifications…
        </p>

      </article>

    </section>

  </main>

  <script type="module">
  import { supabase } from '../backend/supabase.js';
  import { 
    getUserNotifications, 
    getUnreadCount, 
    markNotificationAsRead, 
    markAllNotificationsAsRead, 
    deleteNotification 
  } from '../backend/notificationService.js';

  let currentUser = null, allNotifications = [], currentFilter = 'all';

  async function checkAuth() {
    const { data: { session } } = await supabase.auth.getSession();

    if (!session) {
      window.location.href = 'index.html';
      return null;
    }

    currentUser = session.user;
    return currentUser;
  }

  async function loadNotifications() {
    if (!currentUser) return;

    const c = document.getElementById('notificationsContainer');

    c.innerHTML = `
      <article class="loading-state">
        <figure class="spinner"></figure>
        <p style="margin-top:10px;font-size:13px;">Loading…</p>
      </article>
    `;

    allNotifications = await getUserNotifications(currentUser.id);

    await updateUnreadCount();

    renderNotifications();
  }

  async function updateUnreadCount() {
    if (!currentUser) return;

    const count = await getUnreadCount(currentUser.id);

    const badge = document.getElementById('unreadBadge');
    const btn = document.getElementById('markAllReadBtn');

    if (count > 0) {
      badge.textContent = count;
      badge.style.display = 'inline-block';
      btn.style.display = 'inline-flex';
    } else {
      badge.style.display = 'none';
      btn.style.display = 'none';
    }
  }

  function formatTime(ds) {
    const d = new Date(ds),
          now = new Date();

    const dm = Math.floor((now - d) / 60000),
          dh = Math.floor(dm / 60),
          dd = Math.floor(dh / 24);

    if (dm < 1) return 'Just now';
    if (dm < 60) return `${dm}m ago`;
    if (dh < 24) return `${dh}h ago`;
    if (dd < 7) return `${dd}d ago`;

    return d.toLocaleDateString('en-ZA', {
      day: 'numeric',
      month: 'short',
      year: 'numeric'
    });
  }

  function escHtml(s) {
    if (!s) return '';

    const d = document.createElement('div');

    d.textContent = s;

    return d.innerHTML;
  }

  function renderNotifications() {
    const c = document.getElementById('notificationsContainer');

    let filtered = allNotifications;

    if (currentFilter === 'unread') {
      filtered = allNotifications.filter(n => !n.is_read);
    }

    if (currentFilter === 'appointment') {
      filtered = allNotifications.filter(n => n.type === 'appointment');
    }

    if (!filtered.length) {
      const msg =
        currentFilter === 'unread'
          ? 'No unread notifications'
          : currentFilter === 'appointment'
            ? 'No appointment notifications'
            : 'No notifications yet';

      c.innerHTML = `
        <article class="empty-state">
          <p class="empty-icon">🔔</p>
          <p>${msg}</p>
        </article>
      `;

      return;
    }

    c.innerHTML = `
      <section class="notif-list">
        ${filtered.map(n => `
          <article class="notif-item ${!n.is_read ? 'unread' : ''}"
                   data-id="${n.id}">

            <header class="notif-head">

              <p class="notif-type ${n.type}">
                ${n.type || 'general'}
              </p>

              <time class="notif-time">
                ${formatTime(n.created_at)}
              </time>

            </header>

            <p class="notif-msg">
              ${escHtml(n.message)}
            </p>

            <nav class="notif-actions" aria-label="Notification actions">

              ${!n.is_read
                ? `<button class="notif-action-btn mark-read" data-id="${n.id}">
                    ✓ Mark as read
                  </button>`
                : ''}

              <button class="notif-action-btn del delete"
                      data-id="${n.id}">
                ✕ Delete
              </button>

            </nav>

          </article>
        `).join('')}
      </section>
    `;

    c.querySelectorAll('.mark-read').forEach(btn =>
      btn.addEventListener('click', async e => {
        e.stopPropagation();

        await markNotificationAsRead(btn.dataset.id);

        await loadNotifications();
      })
    );

    c.querySelectorAll('.delete').forEach(btn =>
      btn.addEventListener('click', async e => {
        e.stopPropagation();

        if (confirm('Delete this notification?')) {
          await deleteNotification(btn.dataset.id);
          await loadNotifications();
        }
      })
    );

    c.querySelectorAll('.notif-item').forEach(item =>
      item.addEventListener('click', async e => {
        if (e.target.classList.contains('notif-action-btn')) return;

        const n = allNotifications.find(x => x.id === item.dataset.id);

        if (n && !n.is_read) {
          await markNotificationAsRead(item.dataset.id);
          await loadNotifications();
        }
      })
    );
  }

  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await supabase.auth.signOut();
    window.location.href = 'index.html';
  });

  document.getElementById('markAllReadBtn').addEventListener('click', async () => {
    if (currentUser && confirm('Mark all as read?')) {
      await markAllNotificationsAsRead(currentUser.id);
      await loadNotifications();
    }
  });

  document.querySelectorAll('.filter-btn').forEach(btn =>
    btn.addEventListener('click', () => {

      document.querySelectorAll('.filter-btn')
        .forEach(b => b.classList.remove('active'));

      btn.classList.add('active');

      currentFilter = btn.dataset.filter;

      renderNotifications();
    })
  );

  async function init() {
    await checkAuth();

    if (currentUser) {
      await loadNotifications();
    }
  }

  init();
  </script>
  <script type="module" src="../backend/nav.js"></script>

</body>
</html>
