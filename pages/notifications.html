<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notifications | Health-Flow</title>
  <link rel="stylesheet" href="shared.css" />
  <script src="https://unpkg.com/@supabase/supabase-js@2.39.0/dist/umd/supabase.js"></script>
  <style>
    .notif-list {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      overflow: hidden;
    }
    .notif-item {
      padding: 16px 18px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.12s;
      position: relative;
    }
    .notif-item:last-child { border-bottom: none; }
    .notif-item:hover { background: var(--surface2); }
    .notif-item.unread { background: rgba(0,229,160,0.04); border-left: 2px solid var(--accent); }

    .notif-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 6px;
      flex-wrap: wrap;
    }
    .notif-type {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      padding: 2px 8px;
      border-radius: 3px;
      background: var(--surface2);
      color: var(--text-muted);
    }
    .notif-type.appointment { color: var(--accent); background: rgba(0,229,160,0.1); }
    .notif-time { font-size: 10px; color: var(--text-muted); }
    .notif-msg { font-size: 12px; line-height: 1.55; margin-bottom: 8px; }
    .notif-actions { display: flex; gap: 14px; }
    .notif-action-btn {
      background: none; border: none;
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-muted);
      cursor: pointer;
      transition: color 0.15s;
      padding: 0;
    }
    .notif-action-btn:hover { color: var(--accent); }
    .notif-action-btn.del:hover { color: var(--accent2); }

    .filters { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; }
    .filter-btn {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.06em;
      padding: 5px 12px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s;
    }
    .filter-btn.active { background: var(--accent); color: var(--bg); border-color: var(--accent); }
    .filter-btn:hover:not(.active) { border-color: var(--text-muted); color: var(--text); }

    .unread-badge {
      background: var(--accent);
      color: var(--bg);
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 999px;
      margin-left: 8px;
      display: none;
    }

    .page-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .page-title {
      font-family: var(--font-disp);
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
    }
  </style>
</head>
<body>

  <header class="topbar">
    <span class="brand">
      <span class="brand-icon">✚</span>
      <strong class="brand-name">Health-Flow</strong>
    </span>
    <div class="topbar-right">
      <a href="map.html" class="btn btn-outline">Map</a>
      <button id="logoutBtn" class="btn btn-ghost">Sign out</button>
    </div>
  </header>

  <main class="page-wide">
    <div class="page-head">
      <div class="page-title">
        Notifications
        <span id="unreadBadge" class="unread-badge">0</span>
      </div>
      <button id="markAllReadBtn" class="btn btn-primary" style="display:none;">Mark all read</button>
    </div>

    <div class="filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="unread">Unread</button>
      <button class="filter-btn" data-filter="appointment">Appointments</button>
    </div>

    <div id="notificationsContainer">
      <div class="loading-state"><div class="spinner"></div><div style="margin-top:10px;font-size:12px;">Loading notifications…</div></div>
    </div>
  </main>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js';
    import { getUserNotifications, markNotificationAsRead, markAllNotificationsAsRead, deleteNotification, getUnreadCount } from '../backend/notificationService.js';

    const sb = createClient("https://ixikhufrylaugpdxokwu.supabase.co","eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml4aWtodWZyeWxhdWdwZHhva3d1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU2NTQ0NTIsImV4cCI6MjA5MTIzMDQ1Mn0.F7g_bNWAsxjWtkHihVNYPicghiKOisgHGV9-zaBjXvQ");

    let currentUser = null, allNotifications = [], currentFilter = 'all';

    async function checkAuth() {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) { window.location.href = 'index.html'; return null; }
      currentUser = session.user; return currentUser;
    }

    async function loadNotifications() {
      if (!currentUser) return;
      const c = document.getElementById('notificationsContainer');
      c.innerHTML = '<div class="loading-state"><div class="spinner"></div><div style="margin-top:10px;font-size:12px;">Loading…</div></div>';
      allNotifications = await getUserNotifications(currentUser.id);
      await updateUnreadCount(); renderNotifications();
    }

    async function updateUnreadCount() {
      if (!currentUser) return;
      const count = await getUnreadCount(currentUser.id);
      const badge = document.getElementById('unreadBadge');
      const btn   = document.getElementById('markAllReadBtn');
      if (count > 0) { badge.textContent = count; badge.style.display='inline-block'; btn.style.display='inline-flex'; }
      else { badge.style.display='none'; btn.style.display='none'; }
    }

    function formatTime(ds) {
      const d = new Date(ds), now = new Date();
      const dm = Math.floor((now-d)/60000), dh = Math.floor(dm/60), dd = Math.floor(dh/24);
      if (dm < 1) return 'Just now';
      if (dm < 60) return `${dm}m ago`;
      if (dh < 24) return `${dh}h ago`;
      if (dd < 7)  return `${dd}d ago`;
      return d.toLocaleDateString('en-ZA',{day:'numeric',month:'short',year:'numeric'});
    }

    function escHtml(s) {
      if (!s) return '';
      const d = document.createElement('div'); d.textContent = s; return d.innerHTML;
    }

    function renderNotifications() {
      const c = document.getElementById('notificationsContainer');
      let filtered = allNotifications;
      if (currentFilter === 'unread')      filtered = allNotifications.filter(n => !n.is_read);
      if (currentFilter === 'appointment') filtered = allNotifications.filter(n => n.type === 'appointment');
      if (!filtered.length) {
        const msg = currentFilter === 'unread' ? 'No unread notifications' : currentFilter === 'appointment' ? 'No appointment notifications' : 'No notifications';
        c.innerHTML = `<div class="empty-state"><div class="empty-icon">🔔</div>${msg}</div>`;
        return;
      }
      c.innerHTML = `<div class="notif-list">${filtered.map(n => `
        <div class="notif-item ${!n.is_read?'unread':''}" data-id="${n.id}">
          <div class="notif-head">
            <span class="notif-type ${n.type}">${n.type||'general'}</span>
            <span class="notif-time">${formatTime(n.created_at)}</span>
          </div>
          <div class="notif-msg">${escHtml(n.message)}</div>
          <div class="notif-actions">
            ${!n.is_read ? `<button class="notif-action-btn mark-read" data-id="${n.id}">✓ Mark as read</button>` : ''}
            <button class="notif-action-btn del delete" data-id="${n.id}">✕ Delete</button>
          </div>
        </div>`).join('')}</div>`;

      c.querySelectorAll('.mark-read').forEach(btn => btn.addEventListener('click', async e => {
        e.stopPropagation(); await markNotificationAsRead(btn.dataset.id); await loadNotifications();
      }));
      c.querySelectorAll('.delete').forEach(btn => btn.addEventListener('click', async e => {
        e.stopPropagation(); if (confirm('Delete this notification?')) { await deleteNotification(btn.dataset.id); await loadNotifications(); }
      }));
      c.querySelectorAll('.notif-item').forEach(item => item.addEventListener('click', async e => {
        if (e.target.classList.contains('notif-action-btn')) return;
        const n = allNotifications.find(x => x.id === item.dataset.id);
        if (n && !n.is_read) { await markNotificationAsRead(item.dataset.id); await loadNotifications(); }
      }));
    }

    document.getElementById('logoutBtn').addEventListener('click', async () => { await sb.auth.signOut(); window.location.href='index.html'; });
    document.getElementById('markAllReadBtn').addEventListener('click', async () => {
      if (currentUser && confirm('Mark all as read?')) { await markAllNotificationsAsRead(currentUser.id); await loadNotifications(); }
    });
    document.querySelectorAll('.filter-btn').forEach(btn => btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = btn.dataset.filter;
      renderNotifications();
    }));

    async function init() { await checkAuth(); if (currentUser) await loadNotifications(); }
    init();
  </script>
</body>
</html>
