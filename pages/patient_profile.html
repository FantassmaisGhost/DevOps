<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Portal | SA Health-Flow</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <style>
        * { font-family: 'Inter', sans-serif; }

        body { background: #f8fafc; }

        .required-label::after {
            content: " *";
            color: #dc2626;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #2563eb;
            ring: 1px;
        }

        .toast-notify {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
            padding: 1rem 1.5rem;
            border-radius: 0.75rem;
            color: white;
            display: none;
            align-items: center;
            gap: 10px;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
        }
    </style>
</head>

<body class="antialiased">

    <aside id="toast"
           class="toast-notify bg-slate-800"
           aria-live="polite">
    </aside>

    <main class="max-w-6xl mx-auto p-4 md:p-8">

        <header class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">

            <section>
                <h1 class="text-3xl font-bold text-slate-900 tracking-tight">
                    Patient Admission Portal
                </h1>

                <p class="text-slate-500">
                    POPIA Compliant Medical Profile Management
                </p>
            </section>

            <aside class="bg-white border border-green-100 p-3 rounded-xl flex items-center gap-3 shadow-sm">

                <figure class="bg-green-100 p-2 rounded-full">
                    <i class="fas fa-user-shield text-green-700"></i>
                </figure>

                <section class="text-xs">
                    <p class="font-bold text-slate-800 uppercase">
                        POPIA Verified
                    </p>

                    <p class="text-slate-500">
                        Data hosted in RSA
                    </p>
                </section>
            </aside>
        </header>

        <section class="grid grid-cols-1 lg:grid-cols-12 gap-8">

            <aside class="lg:col-span-4 space-y-6">

                <article class="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden">

                    <header class="p-8 text-center bg-gradient-to-b from-slate-50 to-white">

                        <figure id="avatar"
                                class="w-24 h-24 bg-blue-600 rounded-full mx-auto mb-4 flex items-center justify-center text-white text-3xl font-bold shadow-inner">
                            ?
                        </figure>

                        <h2 id="summaryName"
                            class="text-xl font-bold text-slate-800">
                            New Patient
                        </h2>

                        <p id="summaryID"
                           class="text-sm text-slate-400">
                            ID: —
                        </p>
                    </header>

                    <section class="p-6 space-y-4 border-t border-slate-100">

                        <p class="flex justify-between items-center text-sm">
                            <strong class="text-slate-500 font-normal">
                                Medical Aid
                            </strong>

                            <span id="summaryMedAid"
                                  class="font-semibold text-blue-700 uppercase">
                                —
                            </span>
                        </p>

                        <p class="flex justify-between items-center text-sm">
                            <strong class="text-slate-500 font-normal">
                                Occupation
                            </strong>

                            <span id="summaryOccupation"
                                  class="font-medium text-slate-700">
                                —
                            </span>
                        </p>

                        <p class="flex justify-between items-center text-sm">
                            <strong class="text-slate-500 font-normal">
                                Blood Group
                            </strong>

                            <span id="summaryBlood"
                                  class="px-2 py-1 bg-red-50 text-red-700 rounded-md font-bold">
                                —
                            </span>
                        </p>
                    </section>
                </article>

                <section class="bg-blue-900 text-white rounded-3xl p-6 shadow-lg">

                    <h3 class="font-bold mb-4 flex items-center gap-2">
                        <i class="fas fa-notes-medical"></i>
                        Clinical Snapshot
                    </h3>

                    <section class="space-y-4 text-sm">

                        <article>
                            <p class="opacity-70 text-xs uppercase font-bold tracking-wider">
                                Allergies
                            </p>

                            <p id="alertAllergies"
                               class="font-semibold text-rose-300">
                                None Known
                            </p>
                        </article>

                        <article>
                            <p class="opacity-70 text-xs uppercase font-bold tracking-wider">
                                Conditions
                            </p>

                            <p id="alertConditions"
                               class="font-semibold">
                                None Reported
                            </p>
                        </article>

                    </section>
                </section>
            </aside>

            <section class="lg:col-span-8">

                <form id="saPatientForm"
                      class="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden">

                    <header class="p-6 border-b border-slate-100 bg-slate-50/50">
                        <h3 class="font-bold text-slate-800">
                            Personal Information
                        </h3>
                    </header>

                    <section class="p-6 grid grid-cols-1 md:grid-cols-2 gap-6">

                        <fieldset class="md:col-span-2">
                            <label for="fullName"
                                   class="required-label block text-xs font-bold text-slate-500 uppercase mb-2">
                                Full Name (As per ID)
                            </label>

                            <input type="text"
                                   id="fullName"
                                   required
                                   class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3"
                                   placeholder="e.g. Sipho Nkosi">
                        </fieldset>

                        <fieldset>
                            <label for="saID"
                                   class="required-label block text-xs font-bold text-slate-500 uppercase mb-2">
                                South African ID Number
                            </label>

                            <input type="text"
                                   id="saID"
                                   required
                                   pattern="[0-9]{13}"
                                   maxlength="13"
                                   class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3"
                                   placeholder="13-digit number">
                        </fieldset>

                        <fieldset>
                            <label for="dob"
                                   class="required-label block text-xs font-bold text-slate-500 uppercase mb-2">
                                Date of Birth
                            </label>

                            <input type="date"
                                   id="dob"
                                   required
                                   class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3">
                        </fieldset>

                        <fieldset>
                            <label for="gender"
                                   class="required-label block text-xs font-bold text-slate-500 uppercase mb-2">
                                Gender
                            </label>

                            <select id="gender"
                                    required
                                    class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3">

                                <option value="">Select</option>
                                <option>Male</option>
                                <option>Female</option>
                                <option>Non-binary</option>
                                <option>Other</option>

                            </select>
                        </fieldset>

                        <fieldset>
                            <label for="occupation"
                                   class="required-label block text-xs font-bold text-slate-500 uppercase mb-2">
                                Occupation
                            </label>

                            <input type="text"
                                   id="occupation"
                                   required
                                   class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3"
                                   placeholder="e.g. Teacher, Engineer">
                        </fieldset>

                    </section>

                </form>
            </section>
        </section>
    </main>

    <script>
        const form = document.getElementById('saPatientForm');

        function showToast(msg, color = 'bg-slate-800') {
            const t = document.getElementById('toast');

            t.innerText = msg;
            t.className = `toast-notify ${color} flex`;
            t.style.display = 'flex';

            setTimeout(() => {
                t.style.display = 'none';
            }, 3000);
        }

        function updateSummary(data) {
            document.getElementById('summaryName').innerText = data.fullName || 'New Patient';
            document.getElementById('summaryID').innerText = `ID: ${data.saID || '—'}`;
            document.getElementById('summaryMedAid').innerText = data.medAidName || 'PRIVATE';
            document.getElementById('summaryOccupation').innerText = data.occupation || '—';
            document.getElementById('summaryBlood').innerText = data.bloodType || '—';
            document.getElementById('alertAllergies').innerText = data.allergies || 'None Known';
            document.getElementById('alertConditions').innerText = data.medicalConditions || 'None Reported';

            const initials = data.fullName
                ? data.fullName.split(' ').map(n => n[0]).join('').toUpperCase()
                : '?';

            document.getElementById('avatar').innerText = initials.substring(0,2);
        }

        form.addEventListener('submit', (e) => {
            e.preventDefault();

            const data = {
                fullName: document.getElementById('fullName').value,
                saID: document.getElementById('saID').value,
                occupation: document.getElementById('occupation').value,
                medAidName: document.getElementById('medAidName').value,
                bloodType: document.getElementById('bloodType').value,
                allergies: document.getElementById('allergies').value,
                medicalConditions: document.getElementById('medicalConditions').value
            };

            localStorage.setItem('sa_patient_data_full', JSON.stringify(data));

            updateSummary(data);

            showToast('✅ Profile Saved under POPIA standards');
        });

        window.onload = () => {
            const saved = localStorage.getItem('sa_patient_data_full');

            if (saved) {
                updateSummary(JSON.parse(saved));
            }
        };
    </script>

</body>
</html>
