<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redirecting… | Health-Flow</title>
  <link rel="stylesheet" href="shared.css" />
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .redirect-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 48px 40px;
      text-align: center;
      width: 100%;
      max-width: 360px;
      box-shadow: var(--shadow);
    }
    .redirect-title { font-family: var(--font-disp); font-size: 18px; font-weight: 800; margin: 16px 0 8px; }
    #message { font-size: 12px; color: var(--text-muted); }
    #errorMsg { font-size: 11px; color: var(--accent2); margin-top: 12px; }
  </style>
</head>
<body>
  <div class="redirect-card">
    <div class="spinner" style="width:32px;height:32px;border-width:3px;margin:0 auto;"></div>
    <div class="redirect-title">Health-Flow</div>
    <p id="message">Redirecting you to your dashboard…</p>
    <p id="errorMsg"></p>
  </div>
  <script type="module" src="../backend/redirect.js"></script>
</body>
</html>
