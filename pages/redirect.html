<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redirecting… | Health-Flow</title>

  <link rel="stylesheet" href="shared.css" />

  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(31,29,20,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(31,29,20,0.04) 1px, transparent 1px);
      background-size: 32px 32px;
      pointer-events: none;
      z-index: 0;
    }

    .redirect-card {
      background: var(--surface);
      border: 1.5px solid var(--border-md);
      border-radius: var(--radius-lg);
      padding: 56px 44px;
      text-align: center;
      width: 100%;
      max-width: 360px;
      box-shadow: var(--shadow-md);
      position: relative;
      z-index: 1;
    }

    .redirect-logo {
      width: 52px;
      height: 52px;
      background: var(--teal);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      color: #fff;
      margin: 0 auto 20px;
      box-shadow: 0 4px 16px rgba(0,137,123,0.35);
    }

    .redirect-title {
      font-family: var(--font-disp);
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 10px;
      color: var(--ink);
      letter-spacing: -0.01em;
    }

    #message {
      font-size: 12px;
      color: var(--ink-3);
      margin-bottom: 6px;
    }

    #errorMsg {
      font-size: 12px;
      color: var(--rust);
      margin-top: 12px;
    }
  </style>
</head>

<body>
  
  <main class="redirect-card">

    <header>

      <figure class="redirect-logo" aria-hidden="true">
        ✚
      </figure>

      <progress
        class="spinner"
        aria-label="Redirecting"
        style="width:28px;height:28px;border-width:3px;margin:0 auto 20px;"
      ></progress>

      <h1 class="redirect-title">
        Health-Flow
      </h1>

    </header>

    <section>
      <div id="redirect-status" style="position:fixed; bottom:10px; left:10px; right:10px; background:#111; color:#0f0; padding:8px; font-size:12px; z-index:9999; border:1px solid #0f0; border-radius:4px;">Initializing...</div>
      
      <p id="message">
        Redirecting you to your dashboard…
      </p>

      <output id="errorMsg"></output>

    </section>

  </main>

  <script type="module" src="../backend/redirect.js"></script>

</body>
</html>
