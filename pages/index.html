<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Health-Flow | Login</title>
  <link rel="stylesheet" href="shared.css" />
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      background: var(--bg);
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(31,29,20,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(31,29,20,0.04) 1px, transparent 1px);
      background-size: 32px 32px;
      pointer-events: none;
      z-index: 0;
    }

    .login-wrap {
      width: 100%;
      max-width: 420px;
      background: var(--surface);
      border: 1.5px solid var(--border-md);
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--shadow-md);
      position: relative;
      z-index: 1;
    }

    .login-header {
      padding: 32px 32px 24px;
      border-bottom: 1px solid var(--border);
      text-align: center;
      background: var(--obsidian);
      position: relative;
      overflow: hidden;
    }

    .login-header::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(247,244,238,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(247,244,238,0.03) 1px, transparent 1px);
      background-size: 24px 24px;
    }

    .login-logo {
      width: 56px;
      height: 56px;
      background: var(--teal);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      color: #fff;
      margin: 0 auto 16px;
      box-shadow: 0 4px 16px rgba(0,137,123,0.4);
      position: relative;
      z-index: 1;
    }

    .login-title {
      font-family: var(--font-disp);
      font-size: 22px;
      font-weight: 700;
      color: #F7F4EE;
      letter-spacing: -0.01em;
      position: relative;
      z-index: 1;
    }

    .login-sub {
      font-size: 11px;
      color: rgba(247,244,238,0.4);
      margin-top: 4px;
      letter-spacing: 0.04em;
      position: relative;
      z-index: 1;
    }

    .login-body {
      padding: 28px 32px;
    }

    .role-row {
      display: flex;
      gap: 6px;
      margin-bottom: 20px;
    }

    .role-opt {
      flex: 1;
      position: relative;
    }

    .role-opt input[type="radio"] {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
    }

    .role-opt label {
      display: block;
      text-align: center;
      padding: 8px 4px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      border: 1.5px solid var(--border-md);
      border-radius: var(--radius-sm);
      cursor: pointer;
      color: var(--ink-3);
      background: var(--surface2);
      transition: all 0.15s;
      font-family: var(--font-body);
    }

    .role-opt input:checked + label {
      border-color: var(--teal);
      color: var(--teal);
      background: var(--teal-light);
    }

    .form-group {
      margin-bottom: 14px;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 16px 0;
      font-size: 10px;
      color: var(--ink-4);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-family: var(--font-body);
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border-md);
    }

    .btn-google {
      width: 100%;
      background: var(--surface2);
      border: 1.5px solid var(--border-md);
      border-radius: var(--radius-sm);
      color: var(--ink);
      font-family: var(--font-body);
      font-size: 12px;
      font-weight: 700;
      padding: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: border-color 0.15s, background 0.15s;
    }

    .btn-google:hover {
      border-color: var(--ink-3);
      background: var(--surface);
    }

    .btn-submit {
      width: 100%;
      background: var(--obsidian);
      color: #F7F4EE;
      border: none;
      border-radius: var(--radius-sm);
      font-family: var(--font-body);
      font-size: 13px;
      font-weight: 700;
      padding: 12px;
      cursor: pointer;
      transition: opacity 0.15s;
      letter-spacing: 0.01em;
      margin-bottom: 10px;
      box-shadow: 0 2px 6px rgba(31,29,20,0.28);
    }

    .btn-submit:hover:not(:disabled) {
      opacity: 0.85;
    }

    .btn-submit:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .btn-secondary-link {
      width: 100%;
      background: transparent;
      border: 1.5px solid var(--border-md);
      border-radius: var(--radius-sm);
      color: var(--ink-2);
      font-family: var(--font-body);
      font-size: 12px;
      padding: 9px;
      cursor: pointer;
      transition: all 0.15s;
      margin-bottom: 8px;
      display: block;
      text-align: center;
    }

    .btn-secondary-link:hover {
      border-color: var(--teal);
      color: var(--teal);
    }

    .btn-toggle {
      width: 100%;
      background: none;
      border: none;
      color: var(--ink-3);
      font-family: var(--font-body);
      font-size: 12px;
      cursor: pointer;
      transition: color 0.15s;
      padding: 6px 0;
    }

    .btn-toggle:hover {
      color: var(--teal);
    }

    #message {
      font-size: 12px;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      margin-top: 12px;
      display: none;
      line-height: 1.5;
      font-family: var(--font-body);
    }

    #message.error {
      background: var(--rust-light);
      color: var(--rust);
      border: 1.5px solid rgba(185,74,30,0.2);
      display: block;
    }

    #message.success {
      background: var(--teal-light);
      color: var(--teal);
      border: 1.5px solid rgba(0,137,123,0.2);
      display: block;
    }

    #message.info {
      background: var(--cerulean-light);
      color: var(--cerulean);
      border: 1.5px solid rgba(27,79,138,0.2);
      display: block;
    }

    .modal-overlay {
      display: none;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .full {
      grid-column: 1 / -1;
    }

    .modal-footer {
      display: flex;
      gap: 8px;
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }

    .suggestions-container {
      background: var(--surface);
      border: 1.5px solid var(--border-md);
      border-radius: var(--radius-sm);
      max-height: 180px;
      overflow-y: auto;
      margin-top: 4px;
      display: none;
      box-shadow: var(--shadow-sm);
    }

    .suggestion-item {
      padding: 8px 12px;
      font-size: 12px;
      cursor: pointer;
      border-bottom: 1px solid var(--border);
      transition: background 0.1s;
      color: var(--ink);
    }

    .suggestion-item:last-child {
      border-bottom: none;
    }

    .suggestion-item:hover {
      background: var(--teal-light);
      color: var(--teal);
    }

    .suggestion-id {
      font-size: 9px;
      color: var(--ink-3);
      margin-left: 6px;
    }

    small.hint {
      font-size: 10px;
      color: var(--ink-3);
      margin-top: 3px;
      display: block;
    }

    small.err {
      font-size: 10px;
      color: var(--rust);
      margin-top: 3px;
      display: none;
    }
  </style>
</head>

<body>

  <main class="login-wrap">

    <header class="login-header">
      <figure class="login-logo" aria-hidden="true">✚</figure>
      <h1 class="login-title">Health-Flow</h1>
      <p class="login-sub">Clinic Appointment &amp; Queue System</p>
    </header>

    <section class="login-body">

      <h2 id="formTitle" style="font-family:var(--font-disp);font-size:18px;font-weight:700;margin-bottom:18px;letter-spacing:-0.01em;color:var(--ink);">
        Login
      </h2>

      <fieldset style="border:none;margin-bottom:18px;">
        <legend class="field-label-txt" style="margin-bottom:8px;">I am a</legend>

        <section class="role-row">

          <article class="role-opt">
            <input type="radio" name="role" id="r-patient" value="patient" checked />
            <label for="r-patient">Patient</label>
          </article>

          <article class="role-opt">
            <input type="radio" name="role" id="r-staff" value="staff" />
            <label for="r-staff">Staff</label>
          </article>

          <article class="role-opt">
            <input type="radio" name="role" id="r-admin" value="admin" />
            <label for="r-admin">Admin</label>
          </article>

          <article class="role-opt">
            <input type="radio" name="role" id="r-receptionist" value="receptionist" />
            <label for="r-receptionist">Receptionist</label>
          </article>

        </section>
      </fieldset>
      
      <section class="form-group">
        <label class="field-label-txt" for="email">Email</label>
        <input type="email" id="email" class="input" placeholder="you@email.com" />
      </section>

      <section class="form-group">
        <label class="field-label-txt" for="password">Password</label>
        <input type="password" id="password" class="input" placeholder="••••••••" />
      </section>

      <button id="actionBtn" class="btn-submit">Login</button>

      <p class="divider">or</p>

      <button id="googleBtn" class="btn-google">
        <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        Continue with Google
      </button>

      <hr hidden />

      <button id="registerStaffBtn" class="btn-secondary-link">
        📝 Register as Staff
      </button>

      <button id="registerReceptionistBtn" class="btn-secondary-link">
        🧾 Register as Receptionist
      </button>

      <button id="toggleBtn" class="btn-toggle">
        Create new account
      </button>

      <output id="message"></output>

    </section>
  </main>

  <!-- Staff Registration Modal -->
  <dialog class="modal-overlay" id="staffModal">

    <article class="modal-box" style="max-width:500px;">

      <header>
        <h2 class="modal-title">Staff Registration</h2>
        <p class="modal-body">
          Register as staff. You will be able to log in once an admin approves your account.
        </p>
      </header>

      <form class="modal-grid">

        <section class="full field">
          <label class="field-label-txt" for="regEmail">Email address</label>
          <input type="email" id="regEmail" class="input" placeholder="you@clinic.com" />
        </section>

        <section class="full field">
          <label class="field-label-txt" for="regName">Full name</label>
          <input type="text" id="regName" class="input" placeholder="Dr. Full Name" />
        </section>

        <section class="field">
          <label class="field-label-txt" for="regOccupation">Occupation</label>

          <select id="regOccupation" class="input">
            <option value="Doctor">Doctor</option>
            <option value="Nurse">Nurse</option>
            <option value="Receptionist">Receptionist</option>
            <option value="Pharmacist">Pharmacist</option>
            <option value="Administrator">Administrator</option>
          </select>
        </section>

        <section class="field">
          <label class="field-label-txt" for="regPhone">Phone number</label>

          <input type="tel" id="regPhone" class="input" placeholder="082 123 4567" />

          <small class="err" id="phoneError">
            Enter a valid SA number (10 digits)
          </small>
        </section>

        <section class="full field">

          <label class="field-label-txt" for="regClinicName">
            Clinic name
          </label>

          <input
            type="text"
            id="regClinicName"
            class="input"
            placeholder="Start typing…"
            autocomplete="off"
          />

          <aside id="clinicSuggestions" class="suggestions-container"></aside>

          <small class="hint">
            Select your clinic from the suggestions
          </small>

          <small class="err" id="clinicError">
            Please select a clinic from the list
          </small>

        </section>

      </form>

      <footer class="modal-footer">
        <button id="submitStaffReg" class="btn btn-primary" style="flex:1;">
          Register
        </button>

        <button
          id="closeModal"
          class="btn"
          style="background:var(--surface2);color:var(--ink-2);border-color:var(--border-md);"
        >
          Cancel
        </button>
      </footer>

      <p id="regMessage" style="font-size:11px;margin-top:10px;color:var(--ink-3);"></p>

    </article>

  </dialog>

  <script type="module" src="../backend/login.js"></script>

</body>
</html>
