<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Community Clinic System - Debug</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f0f2f5;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            padding: 20px;
        }
        .clinic-card {
            border: 1px solid #ddd;
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
            cursor: pointer;
        }
        .clinic-card:hover {
            background: #f8f9fa;
        }
        .error {
            color: red;
            background: #ffe6e6;
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
        }
        .success {
            color: green;
            background: #e6ffe6;
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
        }
        .debug {
            background: #f0f0f0;
            padding: 10px;
            font-family: monospace;
            font-size: 12px;
            margin: 10px 0;
            border-radius: 4px;
            overflow-x: auto;
        }
        button {
            background: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            margin: 5px;
        }
        .nav-btn {
            background: #ecf0f1;
            color: #333;
        }
        .nav-btn.active {
            background: #3498db;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏥 Community Clinic System</h1>
        
        <div>
            <button class="nav-btn active" onclick="showClinics()">🏥 Find Clinics</button>
            <button class="nav-btn" onclick="showBookings()">📅 My Bookings</button>
        </div>
        
        <div id="content">
            <p>Loading...</p>
        </div>
        
        <div id="debugInfo" class="debug" style="margin-top: 20px;">
            <strong>Debug Info:</strong> Waiting for data...
        </div>
    </div>

    <script>
        // Your Supabase credentials
        const SUPABASE_URL = 'https://ixikhufrylaugpdxokwu.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml4aWtodWZyeWxhdWdwZHhva3d1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU2NTQ0NTIsImV4cCI6MjA5MTIzMDQ1Mn0.F7g_bNWAsxjWtkHihVNYPicghiKOisgHGV9-zaBjXvQ';
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        
        function debug(message, data = null) {
            const debugDiv = document.getElementById('debugInfo');
            const timestamp = new Date().toLocaleTimeString();
            let html = `<strong>${timestamp}</strong> - ${message}<br>`;
            if (data) {
                html += `<pre style="margin-left:20px; background:#fff; padding:8px; border-radius:4px;">${JSON.stringify(data, null, 2)}</pre>`;
            }
            debugDiv.innerHTML += html;
            debugDiv.scrollTop = debugDiv.scrollHeight;
            console.log(message, data);
        }
        
        async function showClinics() {
            debug('🔍 showClinics() called');
            document.getElementById('content').innerHTML = '<p>📋 Loading clinics...</p>';
            
            try {
                debug('Attempting to fetch from Facilities table...');
                
                const { data, error, status } = await supabase
                    .from('Facilities')
                    .select('*')
                    .limit(5);
                
                debug(`Query completed. Status: ${status}`, { data, error });
                
                if (error) {
                    debug(`❌ ERROR: ${error.message}`, error);
                    document.getElementById('content').innerHTML = `
                        <div class="error">
                            <strong>Database Error:</strong><br>
                            ${error.message}<br><br>
                            <strong>Possible fixes:</strong>
                            <ul>
                                <li>Check if "Facilities" table exists in Supabase</li>
                                <li>Check Row Level Security (RLS) policies</li>
                                <li>Verify column names match</li>
                            </ul>
                        </div>
                    `;
                    return;
                }
                
                if (!data || data.length === 0) {
                    debug('⚠️ No data returned from Facilities table');
                    document.getElementById('content').innerHTML = `
                        <div class="error">
                            <strong>No clinics found!</strong><br>
                            Your Facilities table exists but has no data.<br><br>
                            <strong>Next step:</strong> Run this SQL in Supabase SQL Editor:
                            <pre style="background:#eee; padding:10px; margin-top:10px;">
INSERT INTO Facilities (ClinicID, Name, Type, Province) VALUES
('CLINIC001', 'Soweto Clinic', 'Primary Care', 'Gauteng'),
('CLINIC002', 'Cape Town Clinic', 'District Hospital', 'Western Cape'),
('CLINIC003', 'Durban Clinic', 'Community Health', 'KwaZulu-Natal');
                            </pre>
                        </div>
                    `;
                    return;
                }
                
                debug(`✅ Success! Found ${data.length} clinics. First clinic:`, data[0]);
                
                // Display clinics
                let html = '<h2>🏥 Clinics</h2>';
                html += `<p>Found ${data.length} clinics</p>`;
                
                data.forEach(clinic => {
                    html += `
                        <div class="clinic-card" onclick="viewClinicDetails('${clinic.ClinicID}')">
                            <h3>${clinic.Name || 'Unnamed Clinic'}</h3>
                            <p><strong>Type:</strong> ${clinic.Type || 'N/A'}</p>
                            <p><strong>Province:</strong> ${clinic.Province || 'N/A'}</p>
                            <p><strong>Sector:</strong> ${clinic.Sector || 'N/A'}</p>
                            <p><small>ID: ${clinic.ClinicID}</small></p>
                            <button style="margin-top:10px;">View Details →</button>
                        </div>
                    `;
                });
                
                document.getElementById('content').innerHTML = html;
                
            } catch (err) {
                debug(`💥 CATCH ERROR: ${err.message}`, err);
                document.getElementById('content').innerHTML = `
                    <div class="error">
                        <strong>Unexpected Error:</strong><br>
                        ${err.message}
                    </div>
                `;
            }
        }
        
        async function viewClinicDetails(clinicId) {
            debug(`🔍 viewClinicDetails(${clinicId}) called`);
            document.getElementById('content').innerHTML = '<p>Loading clinic details...</p>';
            
            const { data: clinic, error } = await supabase
                .from('Facilities')
                .select('*')
                .eq('ClinicID', clinicId)
                .single();
            
            if (error) {
                debug(`❌ Error fetching clinic: ${error.message}`, error);
                document.getElementById('content').innerHTML = `<div class="error">Error: ${error.message}</div>`;
                return;
            }
            
            debug(`✅ Clinic loaded:`, clinic);
            
            let html = `
                <button onclick="showClinics()">← Back to Clinics</button>
                <div style="margin-top:20px;">
                    <h2>${clinic.Name || 'Unknown Clinic'}</h2>
                    
                    <div style="background:#f8f9fa; padding:15px; border-radius:8px; margin:15px 0;">
                        <h3>📍 Location</h3>
                        <p><strong>Type:</strong> ${clinic.Type || 'N/A'}</p>
                        <p><strong>Subtype:</strong> ${clinic.Subtype || 'N/A'}</p>
                        <p><strong>Sector:</strong> ${clinic.Sector || 'N/A'}</p>
                        <p><strong>Province:</strong> ${clinic.Province || 'N/A'}</p>
                        ${clinic.district ? `<p><strong>District:</strong> ${clinic.district}</p>` : ''}
                    </div>
                    
                    <div style="background:#f8f9fa; padding:15px; border-radius:8px; margin:15px 0;">
                        <h3>📞 Contact</h3>
                        <p>Phone: ${clinic.phone || 'Not available'}</p>
                        <p>Email: ${clinic.email || 'Not available'}</p>
                    </div>
                    
                    <button onclick="alert('Booking feature coming soon!')" style="background:#27ae60; padding:12px; margin-top:10px; width:100%;">
                        Book Appointment
                    </button>
                </div>
            `;
            
            document.getElementById('content').innerHTML = html;
        }
        
        async function showBookings() {
            debug('🔍 showBookings() called');
            
            // Check if user is logged in
            const { data: { user } } = await supabase.auth.getUser();
            debug('Auth user:', user);
            
            if (!user) {
                document.getElementById('content').innerHTML = `
                    <div class="error">
                        <strong>Not logged in</strong><br>
                        Please log in to view your bookings.<br><br>
                        For testing, you can create a test patient.
                    </div>
                `;
                return;
            }
            
            const { data: appointments, error } = await supabase
                .from('Appointments')
                .select('*, Facilities(Name, Type)')
                .eq('PatientID', user.id)
                .limit(10);
            
            if (error) {
                debug(`❌ Error fetching appointments: ${error.message}`, error);
                document.getElementById('content').innerHTML = `<div class="error">Error: ${error.message}</div>`;
                return;
            }
            
            if (!appointments || appointments.length === 0) {
                document.getElementById('content').innerHTML = `
                    <div class="success">
                        <strong>No bookings yet</strong><br>
                        You haven't made any appointments.
                    </div>
                `;
                return;
            }
            
            let html = '<h2>📅 My Bookings</h2>';
            appointments.forEach(apt => {
                html += `
                    <div class="clinic-card">
                        <h3>${apt.Facilities?.Name || 'Unknown Clinic'}</h3>
                        <p>Date: ${apt.appointment_date || 'TBD'}</p>
                        <p>Time: ${apt.appointment_time || 'TBD'}</p>
                        <p>Status: ${apt.status || 'Scheduled'}</p>
                    </div>
                `;
            });
            
            document.getElementById('content').innerHTML = html;
        }
        
        // Make functions global
        window.showClinics = showClinics;
        window.showBookings = showBookings;
        window.viewClinicDetails = viewClinicDetails;
        
        // Start the app
        debug('🚀 App starting...');
        showClinics();
    </script>
</body>
</html>
