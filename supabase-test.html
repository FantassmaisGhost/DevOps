<!DOCTYPE html>
<html>
<head>
    <title>Supabase Test</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <h1>Supabase Connection Test</h1>
    <div id="step1">⏳ Step 1: Page loaded</div>
    <div id="step2">⏳ Step 2: Waiting for Supabase...</div>
    <div id="step3">⏳ Step 3: Not started yet</div>
    <div id="step4">⏳ Step 4: Not started yet</div>
    <div id="result"></div>

    <script>
        // Update step 1
        document.getElementById('step1').innerHTML = '✅ Step 1: Page loaded';
        document.getElementById('step1').style.color = 'green';
        
        // Step 2: Check Supabase loaded
        if (typeof window.supabase !== 'undefined') {
            document.getElementById('step2').innerHTML = '✅ Step 2: Supabase library loaded';
            document.getElementById('step2').style.color = 'green';
        } else {
            document.getElementById('step2').innerHTML = '❌ Step 2: Supabase library NOT loaded!';
            document.getElementById('step2').style.color = 'red';
        }
        
        // Step 3: Create client
        const SUPABASE_URL = 'https://ixikhufrylaugpdxokwu.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml4aWtodWZyeWxhdWdwZHhva3d1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU2NTQ0NTIsImV4cCI6MjA5MTIzMDQ1Mn0.F7g_bNWAsxjWtkHihVNYPicghiKOisgHGV9-zaBjXvQ';
        
        try {
            const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            document.getElementById('step3').innerHTML = '✅ Step 3: Supabase client created';
            document.getElementById('step3').style.color = 'green';
            
            // Step 4: Query database
            document.getElementById('step4').innerHTML = '⏳ Step 4: Querying Facilities table...';
            
            supabase.from('Facilities')
                .select('*')
                .limit(1)
                .then(response => {
                    if (response.error) {
                        document.getElementById('step4').innerHTML = '❌ Step 4: Query failed';
                        document.getElementById('result').innerHTML = `<div style="color:red; margin-top:20px; padding:10px; border:1px solid red;">
                            <strong>Error:</strong> ${response.error.message}<br><br>
                            <strong>Details:</strong> ${JSON.stringify(response.error, null, 2)}
                        </div>`;
                    } else {
                        document.getElementById('step4').innerHTML = '✅ Step 4: Query successful!';
                        document.getElementById('step4').style.color = 'green';
                        
                        if (response.data && response.data.length > 0) {
                            document.getElementById('result').innerHTML = `
                                <div style="color:green; margin-top:20px; padding:10px; border:1px solid green;">
                                    <strong>SUCCESS!</strong><br>
                                    Found ${response.data.length} clinic(s)<br><br>
                                    <strong>First clinic:</strong><br>
                                    <pre>${JSON.stringify(response.data[0], null, 2)}</pre>
                                </div>
                            `;
                        } else {
                            document.getElementById('result').innerHTML = `
                                <div style="color:orange; margin-top:20px; padding:10px; border:1px solid orange;">
                                    <strong>Table is empty</strong><br>
                                    The Facilities table exists but has no data.<br>
                                    You need to add clinic records.
                                </div>
                            `;
                        }
                    }
                })
                .catch(err => {
                    document.getElementById('step4').innerHTML = '❌ Step 4: Exception occurred';
                    document.getElementById('result').innerHTML = `<div style="color:red; margin-top:20px;">
                        Exception: ${err.message}
                    </div>`;
                });
                
        } catch(err) {
            document.getElementById('step3').innerHTML = '❌ Step 3: Failed to create client: ' + err.message;
            document.getElementById('step3').style.color = 'red';
        }
    </script>
</body>
</html>
